<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Pricing Network — Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  :root {
    --bg: #F7F8FA; --surface: #FFFFFF; --surface-alt: #F0F2F5;
    --border: #E5E7EB; --border-mid: #D1D5DB;
    --accent: #2563EB; --accent-dim: #1D4ED8; --accent-bg: #EFF6FF; --accent-text: #1E40AF;
    --gold: #D97706; --gold-bg: #FFFBEB; --gold-border: #FDE68A;
    --error: #DC2626; --error-bg: #FEF2F2;
    --success: #059669; --success-bg: #ECFDF5;
    --text: #111827; --text-muted: #6B7280; --text-light: #9CA3AF;
    --navy: #1E2337; --navy-mid: #252B3B; --navy-light: #2D3448;
    --white: #111827; --slate: #6B7280; --slate-light: #9CA3AF;
    --accent-glow: rgba(37,99,235,0.1);
    --font-body: 'Inter', sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; overflow: hidden; }
  .app-shell { display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden; }

  /* SIDEBAR */
  .sidebar { background: var(--navy); border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; padding: 28px 0; height: 100vh; overflow-y: auto; }
  .sidebar-logo { font-size: 20px; font-weight: 800; color: #F3F4F6; text-decoration: none; letter-spacing: -0.5px; padding: 0 24px; margin-bottom: 28px; display: block; }
  .sidebar-logo span { color: #60A5FA; }
  .sidebar-profile { margin: 0 16px 28px; padding: 14px 16px; background: rgba(37,99,235,0.08); border: 1px solid rgba(37,99,235,0.2); border-radius: 12px; }
  .profile-company { font-size: 14px; font-weight: 700; color: #F3F4F6; margin-bottom: 4px; }
  .profile-tiers-count { font-size: 12px; color: #94A3B8; }
  .sidebar-section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #64748B; padding: 0 24px; margin-bottom: 8px; margin-top: 20px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #CBD5E1; font-size: 14px; text-decoration: none; border-left: 2px solid transparent; transition: color .2s, background .2s, border-color .2s; cursor: pointer; }
  .nav-item:hover { color: #F3F4F6; background: rgba(255,255,255,0.05); }
  .nav-item.active { color: #60A5FA; background: rgba(37,99,235,0.1); border-left-color: #60A5FA; font-weight: 500; }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .nav-badge.gold { background: #D97706; }
  .sidebar-footer { margin-top: auto; padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.07); }
  .user-block { display: flex; align-items: center; gap: 12px; }
  .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(37,99,235,0.2); border: 1px solid rgba(37,99,235,0.35); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #60A5FA; flex-shrink: 0; }
  .user-name { font-size: 13px; font-weight: 500; color: #F3F4F6; }
  .user-role { font-size: 11px; color: #64748B; }
  .btn-signout { display:block; width:100%; margin-top:9px; padding:8px 13px; background:transparent; border:1px solid rgba(248,113,113,0.3); border-radius:7px; color:#F87171; font-family:var(--font-body); font-size:13px; font-weight:500; cursor:pointer; transition:all .12s; text-align:left; }
  .btn-signout:hover { background:rgba(248,113,113,0.06); border-color:#F87171; }

  /* MAIN */
  .main-content { display: flex; flex-direction: column; background: var(--bg); height: 100vh; overflow: hidden; }

  /* TOPBAR */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 16px; }
  .topbar-left h1 { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -0.4px; }
  .topbar-left p { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .btn-topbar { padding: 7px 14px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-family: var(--font-body); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; position: relative; transition: all .12s; }
  .btn-topbar:hover { border-color: var(--border-mid); color: var(--text); }

  /* INBOX (full remaining height) */
  .inbox-wrap { flex: 1; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; border-top: none; }

  /* THREAD LIST */
  .msg-thread-list { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
  .thread-list-header { padding: 13px 16px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .thread-list-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; }
  .msg-thread-empty { padding: 32px 14px; text-align: center; color: var(--text-muted); font-size: 13px; line-height: 1.7; }
  .msg-thread-item { padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; border-left: 3px solid transparent; }
  .msg-thread-item:hover { background: var(--surface-alt); }
  .msg-thread-item.active { background: var(--accent-bg); border-left-color: var(--accent); }
  .msg-thread-item.unread .msg-thread-rfq { color: var(--text); font-weight: 600; }
  .msg-thread-item.active .msg-thread-rfq { color: var(--accent); }
  .msg-thread-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 3px; }
  .msg-thread-rfq { font-size: 13px; font-weight: 500; color: var(--text-muted); line-height: 1.3; }
  .msg-thread-time { font-size: 11px; color: var(--text-light); white-space: nowrap; flex-shrink: 0; }
  .msg-thread-preview { font-size: 12px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg-thread-item.unread .msg-thread-preview { color: var(--text-muted); }
  .msg-thread-unread-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; flex-shrink: 0; }

  /* CONVERSATION */
  .msg-conversation { display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }
  .msg-conv-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: var(--text-muted); font-size: 14px; text-align: center; gap: 7px; background: var(--bg); }
  .msg-conv-header { padding: 13px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .msg-conv-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .msg-conv-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .msg-conv-thread-area { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg-conv-compose { padding: 10px 20px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; display: flex; gap: 8px; align-items: flex-end; }
  .msg-conv-compose .msg-textarea { flex: 1; min-height: 42px; max-height: 100px; resize: none; }

  /* BUBBLES */
  .msg-bubble { max-width: 78%; padding: 9px 13px; border-radius: 9px; font-size: 13px; line-height: 1.6; }
  .msg-bubble.reseller { align-self: flex-end; background: var(--accent-bg); border: 1px solid #BFDBFE; color: var(--text); }
  .msg-bubble.buyer { align-self: flex-start; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); }
  .msg-bubble.broadcast { align-self: center; background: var(--gold-bg); border: 1px solid var(--gold-border); color: var(--gold); font-size: 12px; max-width: 92%; text-align: center; border-radius: 7px; padding: 7px 14px; }
  .msg-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .msg-time { font-size: 11px; color: var(--text-light); margin-top: 2px; text-align: right; }
  .msg-textarea { width: 100%; padding: 9px 12px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font-body); font-size: 14px; outline: none; resize: none; min-height: 42px; }
  .msg-textarea:focus { border-color: var(--accent); background: var(--surface); }
  .msg-textarea::placeholder { color: var(--text-light); }
  .btn-send { padding: 8px 18px; background: var(--accent); border: none; border-radius: 7px; color: #fff; font-family: var(--font-body); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn-send:hover { background: var(--accent-dim); }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

  /* NOTIFICATION DRAWER */
  .notif-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.25); z-index:99; display:none; }
  .notif-backdrop.open { display:block; }
  .notif-drawer { position:fixed; top:0; right:0; width:360px; height:100vh; background:var(--surface); border-left:1px solid var(--border); z-index:100; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .22s ease; box-shadow:-8px 0 24px rgba(0,0,0,0.08); }
  .notif-drawer.open { transform:translateX(0); }
  .notif-drawer-header { padding:18px 20px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .notif-drawer-title { font-size:15px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px; }
  .notif-drawer-close { background:none; border:none; font-size:20px; color:var(--text-muted); cursor:pointer; }
  .notif-drawer-close:hover { color:var(--text); }
  .notif-drawer-actions { padding:10px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .notif-unread-count { font-size:13px; color:var(--text-muted); }
  .notif-mark-all { font-size:12px; color:var(--accent); background:none; border:none; cursor:pointer; font-family:var(--font-body); }
  .notif-mark-all:hover { text-decoration:underline; }
  .notif-list { flex:1; overflow-y:auto; padding:8px 0; }
  .notif-item { display:flex; align-items:flex-start; gap:10px; padding:11px 20px; cursor:pointer; transition:background .1s; }
  .notif-item:hover { background:var(--surface-alt); }
  .notif-item.unread { background:var(--accent-bg); }
  .notif-item.unread.unread-gold { background:var(--gold-bg); }
  .notif-item.unread.unread-error { background:var(--error-bg); }
  .notif-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:5px; }
  .notif-dot.gold { background:var(--gold); }
  .notif-dot.error { background:var(--error); }
  .notif-icon { font-size:16px; flex-shrink:0; }
  .notif-body { flex:1; min-width:0; }
  .notif-msg { font-size:13px; color:var(--text); line-height:1.5; }
  .notif-time { font-size:11px; color:var(--text-light); margin-top:2px; }
  .notif-empty { padding:40px 20px; text-align:center; color:var(--text-muted); font-size:13px; }
  .notif-empty-icon { font-size:28px; margin-bottom:8px; }
</style>
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->

    <div class="sidebar-profile">
      <div class="profile-company" id="sidebar-company">Loading…</div>

    <span class="sidebar-section-label">Menu</span>

    <a class="nav-item" id="nav-browse" href="bidbridge-reseller-open-rfqs.html"><span class="nav-icon">🔍</span> Browse RFQs <span class="nav-badge" id="badge-rfqs" style="display:none"></span></a>
    <a class="nav-item" href="bidbridge-reseller-my-bids.html"><span class="nav-icon">📋</span> My Bids <span class="nav-badge" id="badge-bids" style="display:none"></span></a>
    <a class="nav-item active" href="bidbridge-reseller-messages.html"><span class="nav-icon">💬</span> Messages <span class="nav-badge" id="badge-messages" style="display:none"></span></a>
    <a class="nav-item" href="bidbridge-reseller-dashboard.html#notifications"><span class="nav-icon">🔔</span> Notifications <span class="nav-badge gold" id="notif-badge" style="display:none"></span></a>

    <span class="sidebar-section-label">Account</span>

    <!-- INBOX -->

      <!-- Conversation pane -->
      <div class="msg-conversation" id="msg-inbox-conv">

          <div style="font-size:36px;">💬</div>
          <div style="font-weight:500;">Select a conversation</div>
          <div style="font-size:12px;color:var(--text-light);">Choose a thread on the left to read and reply</div>

</div>

<!-- NOTIFICATION DRAWER -->
<div class="notif-backdrop" id="notif-backdrop" onclick="closeNotifPanel()"></div>
<div class="notif-drawer" id="notif-drawer">
  <div class="notif-drawer-header">
    <div class="notif-drawer-title">🔔 Notifications <span class="nav-badge gold" id="notif-drawer-badge" style="display:none"></span></div>
    <button class="notif-drawer-close" onclick="closeNotifPanel()">×</button>
  </div>
  <div class="notif-drawer-actions">
    <span class="notif-unread-count" id="notif-unread-label"></span>
    <button class="notif-mark-all" onclick="markAllNotifsRead()">Mark all as read</button>
  </div>
  <div class="notif-list" id="notif-list"><div class="notif-empty"><div class="notif-empty-icon">🔔</div>Loading…</div></div>
</div>

<script>
  const { createClient: _createClient } = supabase;
  const _supabase = _createClient('https://kgejpzjoiewrgwzixcaa.supabase.co', 'sb_publishable_LMMf6U9Zg5qX5Buavl1hCA_NEVNRLSy');

  let _resellerUserId = null;
  let _ALL_NOTIFS = [];
  let _notifDismissedKey = '';
  let _notifDismissed = [];
  let _MSG_THREADS = [];
  let _ACTIVE_THREAD_RFQ_ID = null;
  let _ACTIVE_THREAD_BUYER_ID = null;
  let _bidDataByRfq = {};

  async function signOut() { await _supabase.auth.signOut(); window.location.href = 'bidbridge-auth_1.html'; }

  function notifTimeAgo(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'Just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if (days < 7) return days + 'd ago';
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  async function loadPage(session) {
    const userId = session.user.id;
    _resellerUserId = userId;
    _notifDismissedKey = 'bb_notif_dismissed_' + userId;
    _notifDismissed = JSON.parse(localStorage.getItem(_notifDismissedKey) || '[]');

    const { data: profile } = await _supabase.from('reseller_profiles').select('company, status').eq('id', userId).maybeSingle();
    if (!profile || profile.status !== 'approved') { window.location.href = 'bidbridge-reseller-dashboard.html'; return; }
    document.getElementById('sidebar-company').textContent = profile.company || '—';

    const { data: { user } } = await _supabase.auth.getUser();
    const email = user?.email || '';
    const avatarEl = document.getElementById('sidebar-avatar'); if (avatarEl) avatarEl.textContent = email.slice(0,2).toUpperCase();
    const nameEl = document.getElementById('sidebar-name'); if (nameEl) nameEl.textContent = email;

    const { data: myVendors } = await _supabase.from('reseller_vendors').select('vendor, tier').eq('reseller_id', userId).eq('verified', true);
    const tiersEl = document.getElementById('sidebar-tiers');
    if (tiersEl) tiersEl.textContent = myVendors?.length ? myVendors.length + ' vendor authorization' + (myVendors.length !== 1 ? 's' : '') : 'No vendor authorizations';

    const { data: notifRows } = await _supabase.from('notifications').select('id, type, message, rfq_id, read, created_at').eq('user_id', userId).order('created_at', { ascending: false }).limit(40);
    _ALL_NOTIFS = notifRows || [];
    updateNotifBadge();

    // Load bids to get rfq titles and buyer IDs
    const { data: bidRows } = await _supabase.from('bids').select('rfq_id, total_price, status').eq('reseller_id', userId);
    const myRfqIds = [...new Set((bidRows || []).map(b => b.rfq_id))];

    if (myRfqIds.length > 0) {
      const { data: rfqRows } = await _supabase.from('rfqs').select('id, title, buyer_id').in('id', myRfqIds);
      (rfqRows || []).forEach(r => {
        _bidDataByRfq[r.id] = { title: r.title || 'RFQ #' + r.id.slice(0,8).toUpperCase(), buyerId: r.buyer_id };
      });
    }

    await loadMsgThreads(myRfqIds);

    // Auto-open thread from URL param
    const urlRfq = new URLSearchParams(window.location.search).get('rfq');
    if (urlRfq) selectMsgThread(urlRfq);
  }

  async function loadMsgThreads(myRfqIds) {
    if (!_resellerUserId || !myRfqIds || myRfqIds.length === 0) {
      renderMsgThreadList();
      document.getElementById('topbar-sub').textContent = 'No conversations yet';
      return;
    }

    const [{ data: directMsgs }, { data: broadcasts }] = await Promise.all([
      _supabase.from('messages')
        .select('id, rfq_id, sender_id, recipient_id, sender_role, content, is_broadcast, read, created_at')
        .or('sender_id.eq.' + _resellerUserId + ',recipient_id.eq.' + _resellerUserId)
        .eq('is_broadcast', false)
        .order('created_at', { ascending: false }),
      _supabase.from('messages')
        .select('id, rfq_id, sender_id, sender_role, content, is_broadcast, read, created_at')
        .in('rfq_id', myRfqIds)
        .eq('is_broadcast', true)
        .order('created_at', { ascending: false }),
    ]);

    const allMsgs = [...(directMsgs || []), ...(broadcasts || [])];
    const threadMap = {};
    allMsgs.forEach(function(m) {
      if (!threadMap[m.rfq_id]) threadMap[m.rfq_id] = { msgs: [], unread: 0 };
      threadMap[m.rfq_id].msgs.push(m);
      if (!m.read && !m.is_broadcast && m.sender_id !== _resellerUserId) threadMap[m.rfq_id].unread++;
    });

    _MSG_THREADS = Object.keys(threadMap).map(function(rfqId) {
      const { msgs, unread } = threadMap[rfqId];
      const sorted = msgs.sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      const last = sorted[0];
      const rfqData = _bidDataByRfq[rfqId];
      const rfqTitle = (rfqData && rfqData.title) ? rfqData.title : 'RFQ #' + rfqId.slice(0,8).toUpperCase();
      const buyerId = rfqData ? rfqData.buyerId : null;
      const preview = last.is_broadcast ? '📢 ' + last.content : (last.sender_id === _resellerUserId ? 'You: ' + last.content : 'Buyer: ' + last.content);
      return { rfqId, rfqTitle, lastMsg: preview, lastMsgTime: last.created_at, unreadCount: unread, buyerId };
    }).sort(function(a, b) { return new Date(b.lastMsgTime) - new Date(a.lastMsgTime); });

    const totalUnread = _MSG_THREADS.reduce(function(s, t) { return s + t.unreadCount; }, 0);
    const badgeMessages = document.getElementById('badge-messages');
    if (badgeMessages) { if (totalUnread > 0) { badgeMessages.textContent = totalUnread; badgeMessages.style.display = ''; } else badgeMessages.style.display = 'none'; }

    document.getElementById('topbar-sub').textContent = _MSG_THREADS.length + ' conversation' + (_MSG_THREADS.length !== 1 ? 's' : '') + (totalUnread > 0 ? ' · ' + totalUnread + ' unread' : '');

    renderMsgThreadList();
  }

  function renderMsgThreadList() {
    const listEl = document.getElementById('msg-inbox-threads');
    if (!listEl) return;
    const header = '<div class="thread-list-header"><div class="thread-list-title">Conversations</div></div>';
    if (_MSG_THREADS.length === 0) {
      listEl.innerHTML = header +
        '<div class="msg-thread-empty" style="padding:40px 20px;">' +
          '<div style="font-size:36px;margin-bottom:12px;opacity:0.6;">💬</div>' +
          '<div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;">No conversations yet</div>' +
          '<div style="font-size:12px;color:var(--text-muted);line-height:1.6;margin-bottom:16px;">' +
            'Buyer messages appear here after you submit a bid. Start by browsing open RFQs.' +
          '</div>' +
          '<a href="bidbridge-reseller-open-rfqs.html" style="display:inline-block;background:var(--accent);color:#fff;padding:8px 16px;border-radius:7px;text-decoration:none;font-size:12px;font-weight:600;">Browse open RFQs →</a>' +
        '</div>';
      return;
    }
    listEl.innerHTML = header + _MSG_THREADS.map(function(t) {
      const isActive = t.rfqId === _ACTIVE_THREAD_RFQ_ID;
      const hasUnread = t.unreadCount > 0;
      const timeLabel = notifTimeAgo(t.lastMsgTime);
      const preview = (t.lastMsg || '').length > 55 ? t.lastMsg.slice(0, 52) + '…' : (t.lastMsg || '');
      return '<div class="msg-thread-item' + (isActive ? ' active' : '') + (hasUnread ? ' unread' : '') + '" onclick="selectMsgThread(\'' + t.rfqId + '\')">' +
        '<div class="msg-thread-meta">' +
          '<div class="msg-thread-rfq">' + t.rfqTitle.replace(/</g,'&lt;') + '</div>' +
          '<div style="display:flex;align-items:center;gap:5px;">' +
            (hasUnread ? '<span class="msg-thread-unread-badge">' + t.unreadCount + '</span>' : '') +
            '<span class="msg-thread-time">' + timeLabel + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="msg-thread-preview">' + preview.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
      '</div>';
    }).join('');
  }

  async function selectMsgThread(rfqId) {
    _ACTIVE_THREAD_RFQ_ID = rfqId;
    const thread = _MSG_THREADS.find(function(t) { return t.rfqId === rfqId; });
    _ACTIVE_THREAD_BUYER_ID = thread ? thread.buyerId : (_bidDataByRfq[rfqId] ? _bidDataByRfq[rfqId].buyerId : null);
    renderMsgThreadList();

    const convEl = document.getElementById('msg-inbox-conv');
    if (!convEl) return;
    const rfqTitle = thread ? thread.rfqTitle : (_bidDataByRfq[rfqId] ? _bidDataByRfq[rfqId].title : 'Conversation');

    convEl.innerHTML =
      '<div class="msg-conv-header"><div class="msg-conv-title">' + rfqTitle.replace(/</g,'&lt;') + '</div><div class="msg-conv-sub">Buyer is anonymous — their identity is protected</div></div>' +
      '<div class="msg-conv-thread-area" id="msg-conv-thread"><div style="text-align:center;padding:32px;color:var(--slate);font-size:13px;">Loading…</div></div>' +
      '<div class="msg-conv-compose">' +
        '<textarea class="msg-textarea" id="msg-inbox-input" placeholder="Type a message to the buyer…" rows="2"></textarea>' +
        '<button class="btn-send" onclick="sendInboxMsg()">Send →</button>' +
      '</div>';

    let directMsgs, broadcasts;
    if (!_ACTIVE_THREAD_BUYER_ID) {
      const { data: allThreadMsgs } = await _supabase.from('messages')
        .select('id, sender_id, recipient_id, sender_role, content, is_broadcast, created_at, read')
        .eq('rfq_id', rfqId)
        .or('sender_id.eq.' + _resellerUserId + ',recipient_id.eq.' + _resellerUserId)
        .order('created_at', { ascending: true });
      const inferredBuyer = (allThreadMsgs || []).find(function(m) { return m.sender_id !== _resellerUserId && !m.is_broadcast; });
      if (inferredBuyer) {
        _ACTIVE_THREAD_BUYER_ID = inferredBuyer.sender_id;
        if (thread) thread.buyerId = _ACTIVE_THREAD_BUYER_ID;
        if (_bidDataByRfq[rfqId]) _bidDataByRfq[rfqId].buyerId = _ACTIVE_THREAD_BUYER_ID;
      }
      directMsgs = (allThreadMsgs || []).filter(function(m) { return !m.is_broadcast; });
      broadcasts  = (allThreadMsgs || []).filter(function(m) { return m.is_broadcast; });
    } else {
      const results = await Promise.all([
        _supabase.from('messages')
          .select('id, sender_id, sender_role, content, is_broadcast, created_at, read')
          .eq('rfq_id', rfqId).eq('is_broadcast', false)
          .or('and(sender_id.eq.' + _resellerUserId + ',recipient_id.eq.' + _ACTIVE_THREAD_BUYER_ID + '),and(sender_id.eq.' + _ACTIVE_THREAD_BUYER_ID + ',recipient_id.eq.' + _resellerUserId + ')')
          .order('created_at', { ascending: true }),
        _supabase.from('messages')
          .select('id, sender_id, sender_role, content, is_broadcast, created_at, read')
          .eq('rfq_id', rfqId).eq('is_broadcast', true)
          .order('created_at', { ascending: true }),
      ]);
      directMsgs = results[0].data;
      broadcasts  = results[1].data;
    }

    const msgs = [...(directMsgs || []), ...(broadcasts || [])].sort(function(a, b) { return new Date(a.created_at) - new Date(b.created_at); });

    // Mark unread buyer→me messages as read
    const toRead = (directMsgs || []).filter(function(m) { return m.sender_id === _ACTIVE_THREAD_BUYER_ID && !m.read; });
    if (toRead.length > 0) {
      await _supabase.from('messages').update({ read: true }).eq('rfq_id', rfqId).eq('sender_id', _ACTIVE_THREAD_BUYER_ID).eq('recipient_id', _resellerUserId).eq('read', false);
      if (thread) thread.unreadCount = 0;
      const totalUnread = _MSG_THREADS.reduce(function(s, t) { return s + t.unreadCount; }, 0);
      const badgeMessages = document.getElementById('badge-messages');
      if (badgeMessages) { if (totalUnread === 0) badgeMessages.style.display = 'none'; else badgeMessages.textContent = totalUnread; }
      document.getElementById('topbar-sub').textContent = _MSG_THREADS.length + ' conversation' + (_MSG_THREADS.length !== 1 ? 's' : '') + (totalUnread > 0 ? ' · ' + totalUnread + ' unread' : '');
      renderMsgThreadList();
    }

    const threadEl = document.getElementById('msg-conv-thread');
    if (!threadEl) return;

    if (!msgs.length) {
      threadEl.innerHTML = '<div style="text-align:center;padding:32px;color:var(--slate);font-size:13px;">No messages yet — start the conversation below.</div>';
      return;
    }

    threadEl.innerHTML = msgs.map(function(m) {
      const isMine = m.sender_id === _resellerUserId && !m.is_broadcast;
      const senderLabel = m.is_broadcast ? '📢 Buyer (broadcast to all bidders)' : isMine ? 'You' : 'Buyer (anonymous)';
      const bubbleClass = m.is_broadcast ? 'broadcast' : isMine ? 'reseller' : 'buyer';
      const ts = new Date(m.created_at).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
      return '<div><div class="msg-sender">' + senderLabel + '</div><div class="msg-bubble ' + bubbleClass + '">' + m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div><div class="msg-time">' + ts + '</div></div>';
    }).join('');
    threadEl.scrollTop = threadEl.scrollHeight;
  }

  async function sendInboxMsg() {
    const input = document.getElementById('msg-inbox-input');
    const text = input ? input.value.trim() : '';
    if (!text || !_ACTIVE_THREAD_RFQ_ID || !_ACTIVE_THREAD_BUYER_ID) return;
    const sendBtn = document.querySelector('#msg-inbox-conv .btn-send');
    if (sendBtn) sendBtn.disabled = true;

    const { error } = await _supabase.from('messages').insert({
      rfq_id: _ACTIVE_THREAD_RFQ_ID, sender_id: _resellerUserId, recipient_id: _ACTIVE_THREAD_BUYER_ID,
      sender_role: 'reseller', content: text, is_broadcast: false, read: false,
    });
    if (error) { alert('Failed to send. Please try again.'); if (sendBtn) sendBtn.disabled = false; return; }
    if (input) input.value = '';
    if (sendBtn) sendBtn.disabled = false;

    const rfqData = _bidDataByRfq[_ACTIVE_THREAD_RFQ_ID];
    const rfqTitle = rfqData ? rfqData.title : 'your RFQ';
    const snippet = text.length > 60 ? text.slice(0, 57) + '…' : text;
    await _supabase.from('notifications').insert({ user_id: _ACTIVE_THREAD_BUYER_ID, type: 'new_message', message: '💬 New message from a reseller on "' + rfqTitle + '": "' + snippet + '"', rfq_id: _ACTIVE_THREAD_RFQ_ID, read: false });

    const t = _MSG_THREADS.find(function(x) { return x.rfqId === _ACTIVE_THREAD_RFQ_ID; });
    if (t) { t.lastMsg = 'You: ' + text; t.lastMsgTime = new Date().toISOString(); }
    _MSG_THREADS.sort(function(a, b) { return new Date(b.lastMsgTime) - new Date(a.lastMsgTime); });

    selectMsgThread(_ACTIVE_THREAD_RFQ_ID);
  }

  /* NOTIFICATION PANEL */
  function updateNotifBadge() {
    const unread = _ALL_NOTIFS.filter(n => !n.read && !_notifDismissed.includes(n.id));
    [document.getElementById('notif-badge'), document.getElementById('notif-badge-top'), document.getElementById('notif-drawer-badge')].forEach(b => { if (b) { b.textContent = unread.length; b.style.display = unread.length > 0 ? '' : 'none'; } });
    const lbl = document.getElementById('notif-unread-label'); if (lbl) lbl.textContent = unread.length > 0 ? unread.length + ' unread' : 'All caught up';
  }
  function getNotifIcon(type) { return ({ new_rfq:'📋', bid_won:'🏆', bid_lost:'📋', bid_submitted:'💼', rfq_updated:'✏️', rfq_cancelled:'🚫', new_message:'💬', rank_changed:'📈' })[type] || '🔔'; }
  function getNotifAccent(type) { if (type === 'bid_won' || type === 'new_message') return 'accent'; if (type === 'rfq_cancelled' || type === 'bid_lost') return 'error'; return 'gold'; }
  function renderNotifList() {
    const list = document.getElementById('notif-list'); if (!list) return;
    if (!_ALL_NOTIFS.length) { list.innerHTML = '<div class="notif-empty"><div class="notif-empty-icon">🔔</div>No notifications yet</div>'; return; }
    list.innerHTML = _ALL_NOTIFS.map(n => {
      const isUnread = !n.read && !_notifDismissed.includes(n.id);
      const accent = getNotifAccent(n.type);
      return '<div class="notif-item' + (isUnread ? ' unread' + (accent !== 'accent' ? ' unread-' + accent : '') : '') + '" onclick="handleNotifClick(\'' + n.id + '\', \'' + n.type + '\', \'' + (n.rfq_id || '') + '\')">' +
        (isUnread ? '<div class="notif-dot ' + (accent !== 'accent' ? accent : '') + '"></div>' : '<div style="width:7px;flex-shrink:0;"></div>') +
        '<div class="notif-icon">' + getNotifIcon(n.type) + '</div>' +
        '<div class="notif-body"><div class="notif-msg">' + (n.message || '').replace(/</g,'&lt;') + '</div><div class="notif-time">' + notifTimeAgo(n.created_at) + '</div></div></div>';
    }).join('');
  }
  function openNotifPanel() { document.getElementById('notif-drawer').classList.add('open'); document.getElementById('notif-backdrop').classList.add('open'); updateNotifBadge(); renderNotifList(); }
  function closeNotifPanel() { document.getElementById('notif-drawer').classList.remove('open'); document.getElementById('notif-backdrop').classList.remove('open'); }
  function handleNotifClick(id, type, rfqId) {
    const notif = _ALL_NOTIFS.find(n => n.id === id);
    if (notif && !notif.read) { notif.read = true; _notifDismissed = [...new Set([..._notifDismissed, id])]; localStorage.setItem(_notifDismissedKey, JSON.stringify(_notifDismissed)); _supabase.from('notifications').update({ read: true }).eq('id', id); updateNotifBadge(); renderNotifList(); }
    closeNotifPanel();
    if (type === 'new_rfq' || type === 'rfq_updated') window.location.href = 'bidbridge-reseller-open-rfqs.html';
    else if (type === 'bid_won' || type === 'bid_lost') window.location.href = 'bidbridge-reseller-my-bids.html';
    else if (type === 'new_message' && rfqId) selectMsgThread(rfqId);
  }
  function markAllNotifsRead() {
    const ids = _ALL_NOTIFS.filter(n => !n.read).map(n => n.id); if (!ids.length) return;
    _ALL_NOTIFS.forEach(n => n.read = true); _notifDismissed = [...new Set([..._notifDismissed, ...ids])];
    localStorage.setItem(_notifDismissedKey, JSON.stringify(_notifDismissed));
    _supabase.from('notifications').update({ read: true }).in('id', ids);
    updateNotifBadge(); renderNotifList();
  }

  /* INIT */
  (async () => {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.href = 'bidbridge-auth_1.html'; return; }

    // Safety net: if loadPage errors, replace loading spinner with a retry state
    // instead of leaving the user staring at "Loading…" forever
    try {
      await loadPage(session);
    } catch (err) {
      console.error('Failed to load messages:', err);
      const list = document.getElementById('msg-inbox-threads');
      if (list) {
        list.innerHTML = '<div class="thread-list-header"><div class="thread-list-title">Conversations</div></div>' +
          '<div class="msg-thread-empty" style="padding:32px 16px;">' +
            '<div style="font-size:28px;margin-bottom:10px;">⚠️</div>' +
            '<div style="font-size:13px;color:var(--text);margin-bottom:12px;">Couldn\'t load conversations</div>' +
            '<button onclick="window.location.reload()" style="background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;">Retry</button>' +
          '</div>';
      }
    }
  })();
</script>
</body>
</html>
