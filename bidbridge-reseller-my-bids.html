<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Pricing Network — My Bids</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  :root {
    --bg: #F7F8FA; --surface: #FFFFFF; --surface-alt: #F0F2F5;
    --border: #E5E7EB; --border-mid: #D1D5DB;
    --accent: #2563EB; --accent-dim: #1D4ED8; --accent-bg: #EFF6FF; --accent-text: #1E40AF;
    --gold: #D97706; --gold-bg: #FFFBEB; --gold-border: #FDE68A;
    --error: #DC2626; --error-bg: #FEF2F2;
    --success: #059669; --success-bg: #ECFDF5;
    --text: #111827; --text-muted: #6B7280; --text-light: #9CA3AF;
    --navy: #1E2337; --navy-mid: #252B3B; --navy-light: #2D3448;
    --white: #111827; --slate: #6B7280; --slate-light: #9CA3AF;
    --accent-glow: rgba(37,99,235,0.1);
    --font-body: 'Inter', sans-serif;
  }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
  .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

  /* SIDEBAR */
  .sidebar { background: var(--navy); border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; padding: 28px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .sidebar-logo { font-size: 20px; font-weight: 800; color: #F3F4F6; text-decoration: none; letter-spacing: -0.5px; padding: 0 24px; margin-bottom: 28px; display: block; }
  .sidebar-logo span { color: #60A5FA; }
  .sidebar-profile { margin: 0 16px 28px; padding: 14px 16px; background: rgba(37,99,235,0.08); border: 1px solid rgba(37,99,235,0.2); border-radius: 12px; }
  .profile-company { font-size: 14px; font-weight: 700; color: #F3F4F6; margin-bottom: 4px; }
  .sidebar-section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #64748B; padding: 0 24px; margin-bottom: 8px; margin-top: 20px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: #CBD5E1; font-size: 14px; text-decoration: none; border-left: 2px solid transparent; transition: color .2s, background .2s, border-color .2s; cursor: pointer; }
  .nav-item:hover { color: #F3F4F6; background: rgba(255,255,255,0.05); }
  .nav-item.active { color: #60A5FA; background: rgba(37,99,235,0.1); border-left-color: #60A5FA; font-weight: 500; }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .nav-badge.gold { background: #D97706; }
  .sidebar-footer { margin-top: auto; padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.07); }
  .user-block { display: flex; align-items: center; gap: 12px; }
  .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(37,99,235,0.2); border: 1px solid rgba(37,99,235,0.35); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #60A5FA; flex-shrink: 0; }
  .user-name { font-size: 13px; font-weight: 500; color: #F3F4F6; }
  .user-role { font-size: 11px; color: #64748B; }
  .btn-signout { display:block; width:100%; margin-top:9px; padding:8px 13px; background:transparent; border:1px solid rgba(248,113,113,0.3); border-radius:7px; color:#F87171; font-family:var(--font-body); font-size:13px; font-weight:500; cursor:pointer; transition:all .12s; text-align:left; }
  .btn-signout:hover { background:rgba(248,113,113,0.06); border-color:#F87171; }

  /* MAIN */
  .main-content { display: flex; flex-direction: column; background: var(--bg); min-height: 100vh; }

  /* TOPBAR */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; gap: 16px; }
  .topbar-left h1 { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -0.4px; }
  .topbar-left p { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .btn-topbar { padding: 7px 14px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-family: var(--font-body); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; position: relative; transition: all .12s; }
  .btn-topbar:hover { border-color: var(--border-mid); color: var(--text); }

  /* TAB BAR */
  .tab-bar { padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0; }
  .tab-item { padding: 12px 18px; font-size: 14px; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; cursor: pointer; transition: color .12s, border-color .12s; display: flex; align-items: center; gap: 7px; text-decoration: none; }
  .tab-item:hover { color: var(--text); }
  .tab-item.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-count { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--surface-alt); color: var(--text-muted); }
  .tab-item.active .tab-count { background: var(--accent-bg); color: var(--accent); }

  /* CONTENT */
  .page-content { padding: 24px 28px; max-width: 900px; }

  /* RFQ CARDS */
  .rfq-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; cursor: pointer; position: relative; transition: border-color .12s, box-shadow .12s; margin-bottom: 9px; }
  .rfq-card:hover { border-color: #93C5FD; box-shadow: 0 1px 4px rgba(37,99,235,0.06); }
  @keyframes bid-highlight { 0%,100% { box-shadow: none; } 30% { box-shadow: 0 0 0 3px rgba(37,99,235,0.35); } }
  .rfq-card.deep-linked { animation: bid-highlight 1.6s ease 0.15s; }
  .new-tag { position: absolute; top: 11px; right: 13px; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.05em; }
  .bid-status-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--gold-bg); border: 1px solid var(--gold-border); border-radius: 7px; padding: 7px 11px; margin-bottom: 10px; flex-wrap: wrap; }
  .bid-status-left { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .bid-status-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .rfq-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
  .rfq-card-title { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; margin-bottom: 2px; }
  .rfq-card-sub { font-size: 12px; color: var(--text-muted); }
  .rfq-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--border); }
  .rfq-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .rfq-tag { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; }
  .rfq-tag.vendor { background: var(--accent-bg); color: var(--accent); border: 1px solid #BFDBFE; }
  .rfq-tag.strategy { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-border); }
  .rfq-tag.tier-req { background: var(--surface-alt); color: var(--text-muted); border: 1px solid var(--border); }
  .deadline-label { font-size: 12px; font-weight: 500; }
  .deadline-urgent { color: var(--error); }
  .deadline-soon { color: var(--gold); }
  .deadline-ok { color: var(--text-muted); }
  .btn-bid { padding: 7px 16px; background: var(--accent); border: none; border-radius: 7px; color: #fff; font-family: var(--font-body); font-size: 13px; font-weight: 500; cursor: pointer; transition: background .12s; white-space: nowrap; }
  .btn-bid:hover { background: var(--accent-dim); }
  .btn-msg-small { padding: 5px 11px; background: transparent; border: 1px solid var(--border); border-radius: 7px; color: var(--text-muted); font-family: var(--font-body); font-size: 12px; cursor: pointer; transition: all .12s; display: flex; align-items: center; gap: 4px; }
  .btn-msg-small:hover { border-color: var(--accent); color: var(--accent); }
  .unread-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 999px; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 56px 24px; }
  .empty-state h3 { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 7px; }
  .empty-state p { font-size: 14px; color: var(--text-muted); max-width: 300px; margin: 0 auto; }
  .empty-cta { display: inline-block; margin-top: 16px; padding: 9px 20px; background: var(--accent); color: #fff; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; }

  /* BID FORM MODAL (floating overlay) */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: flex-start; justify-content: flex-end; }
  .modal-bg.hidden { display: none; }
  .modal-panel { background: var(--surface); width: 480px; height: 100vh; display: flex; flex-direction: column; box-shadow: -12px 0 40px rgba(0,0,0,0.1); overflow: hidden; }
  .modal-header { padding: 18px 22px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-shrink: 0; }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .modal-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 0; flex-shrink: 0; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 12px; }
  .sku-table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
  .sku-table thead th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); font-weight: 500; padding: 0 7px 9px; text-align: left; }
  .sku-table thead th.right { text-align: right; }
  .sku-table tbody tr { border-top: 1px solid var(--border); }
  .sku-table tbody td { padding: 9px 7px; font-size: 13px; vertical-align: middle; }
  .sku-part { font-family: monospace; font-size: 12px; color: var(--accent); background: var(--accent-bg); padding: 2px 6px; border-radius: 4px; }
  .sku-qty { color: var(--text-muted); text-align: center; }
  .sku-price-wrap { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .sku-price-input { width: 80px; padding: 6px 8px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: var(--font-body); font-size: 13px; text-align: right; outline: none; transition: border-color .12s; }
  .sku-price-input:focus { border-color: var(--accent); }
  .sku-price-input::placeholder { color: var(--text-light); }
  .sku-line-total { font-size: 13px; font-weight: 500; color: var(--text); min-width: 65px; text-align: right; }
  .bid-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .bid-total-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 7px; }
  .bid-total-label { font-size: 14px; color: var(--text-muted); }
  .bid-total-value { font-size: 21px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  .bid-notes-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
  .bid-notes-input { width: 100%; padding: 8px 11px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font-body); font-size: 13px; resize: vertical; outline: none; min-height: 64px; }
  .bid-notes-input:focus { border-color: var(--accent); }
  .bid-notes-input::placeholder { color: var(--text-light); }
  .btn-submit-bid { padding: 9px 20px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-submit-bid:hover { background: var(--accent-dim); }
  .btn-submit-bid:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-cancel-bid { padding: 9px 14px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-family: var(--font-body); font-size: 13px; cursor: pointer; }
  .btn-cancel-bid:hover { border-color: var(--border-mid); color: var(--text); }
  .bid-error { font-size: 13px; color: var(--error); display: none; }
  .bid-success { text-align: center; padding: 32px 20px; }
  .bid-success-icon { font-size: 42px; margin-bottom: 10px; }
  .bid-success-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 7px; }
  .bid-success-sub { font-size: 14px; color: var(--text-muted); }

  /* NOTIFICATION DRAWER */
  .notif-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 298; display: none; }
  .notif-backdrop.open { display: block; }
  .notif-drawer { position: fixed; top: 0; right: -420px; width: 400px; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); z-index: 299; display: flex; flex-direction: column; transition: right .28s cubic-bezier(.4,0,.2,1); box-shadow: -8px 0 32px rgba(0,0,0,0.08); }
  .notif-drawer.open { right: 0; }
  .notif-drawer-header { padding: 20px 22px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .notif-drawer-title { font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .notif-drawer-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 0; }
  .notif-drawer-actions { padding: 9px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .notif-mark-all { background: none; border: none; color: var(--text-muted); font-family: var(--font-body); font-size: 12px; cursor: pointer; padding: 0; }
  .notif-mark-all:hover { color: var(--accent); }
  .notif-unread-count { font-size: 12px; color: var(--text-muted); }
  .notif-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .notif-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 22px; border-bottom: 1px solid rgba(0,0,0,0.04); cursor: pointer; transition: background .1s; }
  .notif-item:hover { background: var(--surface-alt); }
  .notif-item.unread { background: var(--accent-bg); border-left: 3px solid var(--accent); padding-left: 19px; }
  .notif-item.unread-gold { border-left-color: var(--gold); background: var(--gold-bg); }
  .notif-item.unread-error { border-left-color: var(--error); background: var(--error-bg); }
  .notif-icon { font-size: 17px; flex-shrink: 0; margin-top: 1px; }
  .notif-body { flex: 1; min-width: 0; }
  .notif-msg { font-size: 13px; line-height: 1.5; color: var(--text-muted); }
  .notif-item.unread .notif-msg { color: var(--text); font-weight: 500; }
  .notif-time { font-size: 11px; color: var(--text-light); margin-top: 3px; }
  .notif-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 7px; }
  .notif-dot.gold { background: var(--gold); }
  .notif-dot.error { background: var(--error); }
  .notif-empty { text-align: center; padding: 52px 20px; color: var(--text-muted); font-size: 14px; }
  .notif-empty-icon { font-size: 38px; margin-bottom: 10px; }

  @media (max-width: 1024px) { .app-shell { grid-template-columns: 1fr; } .sidebar { display: none; } .page-content { padding: 14px; } .topbar { padding: 10px 14px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="bidbridge-reseller-dashboard.html" class="sidebar-logo">IT Pricing <span>Network</span></a>
    <div class="sidebar-profile">
      <div class="profile-company" id="sidebar-company">—</div>
      <div style="font-size:11px;color:var(--slate);margin-top:3px;" id="sidebar-tiers">Loading…</div>
    </div>
    <div class="sidebar-section-label">Main</div>
    <a class="nav-item" href="bidbridge-reseller-dashboard.html"><span class="nav-icon">⊞</span> Dashboard</a>
    <a class="nav-item" href="bidbridge-reseller-open-rfqs.html"><span class="nav-icon">🔍</span> Open RFQs <span class="nav-badge" id="badge-rfqs" style="display:none"></span></a>
    <a class="nav-item active" href="bidbridge-reseller-my-bids.html"><span class="nav-icon">📨</span> My Bids <span class="nav-badge" id="badge-bids" style="display:none"></span></a>
    <div class="sidebar-section-label">Account</div>
    <a class="nav-item" href="#" onclick="openNotifPanel(); return false;"><span class="nav-icon">🔔</span> Notifications <span class="nav-badge gold" id="notif-badge" style="display:none"></span></a>
    <a class="nav-item" href="bidbridge-reseller-messages.html"><span class="nav-icon">💬</span> Messages <span class="nav-badge" id="badge-messages" style="display:none"></span></a>
    <a class="nav-item" href="bidbridge-reseller-profile.html"><span class="nav-icon">⭐</span> My Profile</a>
    <a class="nav-item" href="bidbridge-reseller-settings.html"><span class="nav-icon">⚙</span> Settings</a>
    <div class="sidebar-footer">
      <div class="user-block">
        <div class="user-avatar" id="sidebar-avatar">—</div>
        <div><div class="user-name" id="sidebar-name">—</div><div class="user-role">Authorized Reseller</div></div>
      </div>
      <button class="btn-signout" onclick="signOut()">↪ Sign out</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <h1>My Bids</h1>
        <p id="topbar-sub">Your bid activity</p>
      </div>
      <div class="topbar-actions">
        <a href="bidbridge-reseller-open-rfqs.html" style="padding:7px 14px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:var(--font-body);font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;">Browse open RFQs →</a>
        <button class="btn-topbar" onclick="openNotifPanel()">🔔 <span class="nav-badge gold" id="notif-badge-top" style="display:none;margin-left:0;"></span></button>
      </div>
    </div>

    <!-- TAB BAR -->
    <div class="tab-bar">
      <div class="tab-item active" id="tab-active" onclick="setTab('active')">Active <span class="tab-count" id="count-active">—</span></div>
      <div class="tab-item" id="tab-won" onclick="setTab('won')">Won <span class="tab-count" id="count-won">—</span></div>
      <div class="tab-item" id="tab-lost" onclick="setTab('lost')">Lost <span class="tab-count" id="count-lost">—</span></div>
      <div class="tab-item" id="tab-cancelled" onclick="setTab('cancelled')" style="color:#DC2626;">Cancelled <span class="tab-count" id="count-cancelled">—</span></div>
    </div>

    <!-- CONTENT -->
    <div class="page-content">
      <div id="bids-list">
        <div class="empty-state"><h3>Loading bids…</h3></div>
      </div>
    </div>
  </div>
</div>

<!-- BID FORM / DETAIL MODAL -->
<div class="modal-bg hidden" id="bid-modal-bg">
  <div class="modal-panel" id="bid-modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="bid-modal-title">Bid Details</div>
        <div class="modal-subtitle" id="bid-modal-subtitle"></div>
      </div>
      <button class="modal-close" onclick="closeBidModal()">×</button>
    </div>
    <div class="modal-body" id="bid-modal-body"></div>
    <div class="modal-footer" id="bid-modal-footer" style="display:none;">
      <span class="bid-error" id="bid-error"></span>
      <div style="width:100%;">
        <label style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-muted);margin-bottom:12px;cursor:pointer;user-select:none;">
          <input type="checkbox" id="bid-auth-checkbox" onchange="document.getElementById('bid-submit-btn').disabled=!this.checked;" style="width:16px;height:16px;accent-color:var(--accent);flex-shrink:0;">
          I confirm I am authorized to sell these products and the prices submitted are accurate.
        </label>
        <div style="display:flex;gap:10px;justify-content:flex-end;">
          <button class="btn-cancel-bid" onclick="closeBidModal()">Cancel</button>
          <button class="btn-submit-bid" id="bid-submit-btn" onclick="submitBid()" disabled>Submit bid →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- NOTIFICATION DRAWER -->
<div class="notif-backdrop" id="notif-backdrop" onclick="closeNotifPanel()"></div>
<div class="notif-drawer" id="notif-drawer">
  <div class="notif-drawer-header">
    <div class="notif-drawer-title">🔔 Notifications <span class="nav-badge gold" id="notif-drawer-badge" style="display:none"></span></div>
    <button class="notif-drawer-close" onclick="closeNotifPanel()">×</button>
  </div>
  <div class="notif-drawer-actions">
    <span class="notif-unread-count" id="notif-unread-label"></span>
    <button class="notif-mark-all" onclick="markAllNotifsRead()">Mark all as read</button>
  </div>
  <div class="notif-list" id="notif-list"><div class="notif-empty"><div class="notif-empty-icon">🔔</div>Loading…</div></div>
</div>

<script>
  const { createClient: _createClient } = supabase;
  const _supabase = _createClient('https://kgejpzjoiewrgwzixcaa.supabase.co', 'sb_publishable_LMMf6U9Zg5qX5Buavl1hCA_NEVNRLSy');

  let MY_BIDS = [];
  let _MY_AUTHORIZED_VENDORS = [];
  let _resellerUserId = null;
  let _ALL_NOTIFS = [];
  let _notifDismissedKey = '';
  let _notifDismissed = [];
  let _currentTab = 'active';
  let _currentBidRfqId = null;
  let _currentBidItems = [];
  let _ALL_RFQS = {};

  async function signOut() { await _supabase.auth.signOut(); window.location.href = 'bidbridge-auth_1.html'; }

  function daysUntil(str) {
    if (!str) return 999;
    const now = new Date(); now.setHours(0,0,0,0);
    return Math.ceil((new Date(str + 'T00:00:00') - now) / 86400000);
  }

  function notifTimeAgo(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'Just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if (days < 7) return days + 'd ago';
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  async function loadPage(session) {
    const userId = session.user.id;
    _resellerUserId = userId;
    _notifDismissedKey = 'bb_notif_dismissed_' + userId;
    _notifDismissed = JSON.parse(localStorage.getItem(_notifDismissedKey) || '[]');

    // Profile
    const { data: profile } = await _supabase.from('reseller_profiles').select('company, status').eq('id', userId).maybeSingle();
    if (!profile || profile.status !== 'approved') { window.location.href = 'bidbridge-reseller-dashboard.html'; return; }
    document.getElementById('sidebar-company').textContent = profile.company || '—';

    // Sidebar user info
    const { data: { user } } = await _supabase.auth.getUser();
    const email = user?.email || '';
    const avatarEl = document.getElementById('sidebar-avatar'); if (avatarEl) avatarEl.textContent = email.slice(0,2).toUpperCase();
    const nameEl = document.getElementById('sidebar-name'); if (nameEl) nameEl.textContent = email;

    // Vendors (sidebar display)
    const { data: myVendors } = await _supabase.from('reseller_vendors').select('vendor, tier').eq('reseller_id', userId).eq('verified', true);
    const tiersEl = document.getElementById('sidebar-tiers');
    if (tiersEl) tiersEl.textContent = myVendors?.length ? myVendors.length + ' vendor authorization' + (myVendors.length !== 1 ? 's' : '') : 'No vendor authorizations';
    _MY_AUTHORIZED_VENDORS = myVendors || [];

    // Notifications
    const { data: notifRows } = await _supabase.from('notifications').select('id, type, message, rfq_id, read, created_at').eq('user_id', userId).order('created_at', { ascending: false }).limit(40);
    _ALL_NOTIFS = notifRows || [];
    updateNotifBadge();

    // My bids
    const { data: bidRows, error: bidErr } = await _supabase.from('bids').select('id, rfq_id, total_price, notes, status, created_at, line_items').eq('reseller_id', userId).order('created_at', { ascending: false });
    if (!bidRows?.length) {
      document.getElementById('bids-list').innerHTML = '<div class="empty-state"><h3>No bids yet</h3><p>When you submit a bid on an open RFQ, it will appear here.</p><a href="bidbridge-reseller-open-rfqs.html" class="empty-cta">Browse open RFQs →</a></div>';
      updateTabCounts([], [], [], []);
      return;
    }

    const myBidRfqIds = [...new Set(bidRows.map(b => b.rfq_id))];

    // Fetch all bids on same RFQs (for rank)
    const [{ data: allBidsOnMyRfqs }, { data: rfqRows }] = await Promise.all([
      _supabase.from('bids').select('rfq_id, total_price, line_items').in('rfq_id', myBidRfqIds),
      _supabase.from('rfqs').select('id, title, status, strategy, vendor_awards, buyer_id, tier_filter, deadline, hq_location, notes, bid_count').in('id', myBidRfqIds),
    ]);

    // Fetch all rfq_items to get vendor names
    const { data: rfqItems } = await _supabase.from('rfq_items').select('rfq_id, vendor').in('rfq_id', myBidRfqIds);
    const vendorsByRfq = {};
    (rfqItems || []).forEach(i => { if (!vendorsByRfq[i.rfq_id]) vendorsByRfq[i.rfq_id] = new Set(); vendorsByRfq[i.rfq_id].add(i.vendor); });

    // Build rfq lookup
    const rfqMap = {};
    (rfqRows || []).forEach(r => {
      rfqMap[r.id] = {
        id: r.id, title: r.title || 'Untitled RFQ', status: r.status,
        strategy: r.strategy || 'sole', vendor_awards: r.vendor_awards || null,
        buyerId: r.buyer_id || null, deadline: r.deadline ? r.deadline.slice(0,10) : null,
        location: r.hq_location || '—', description: r.notes || '',
        bids: r.bid_count ?? 0,
        vendor: [...(vendorsByRfq[r.id] || [])].join(' · '),
      };
    });
    window._ALL_VENDOR_RFQS = Object.values(rfqMap);
    _ALL_RFQS = rfqMap;

    // Rank calculation
    function vendorSubtotal(lineItems, vendor) {
      return (lineItems || []).filter(li => li.vendor === vendor).reduce((s, li) => s + parseFloat(li.line_total || (parseFloat(li.unit_price || 0) * (li.quantity || 1))), 0);
    }
    const rankMap = {};
    myBidRfqIds.forEach(rfqId => {
      const myBid = bidRows.find(b => b.rfq_id === rfqId);
      const myPrice = myBid ? (myBid.total_price || 0) : 0;
      const rfq = rfqMap[rfqId];
      const isSplit = rfq?.strategy === 'split';
      if (isSplit && myBid?.line_items?.length) {
        const vendors = [...new Set(myBid.line_items.map(li => li.vendor).filter(Boolean))];
        const vendorRanks = {};
        vendors.forEach(vendor => {
          const myS = vendorSubtotal(myBid.line_items, vendor);
          const allS = (allBidsOnMyRfqs || []).filter(b => b.rfq_id === rfqId).map(b => vendorSubtotal(b.line_items, vendor)).filter(s => s > 0).sort((a,b) => a-b);
          vendorRanks[vendor] = { rank: (allS.indexOf(myS) + 1) || 1, totalBids: allS.length };
        });
        const ranks = Object.values(vendorRanks).map(v => v.rank);
        rankMap[rfqId] = { rank: Math.max(...ranks), bestRank: Math.min(...ranks), totalBids: Object.values(vendorRanks)[0]?.totalBids || 1, myPrice, vendorRanks, isSplit: true };
      } else {
        const allP = (allBidsOnMyRfqs || []).filter(b => b.rfq_id === rfqId).map(b => b.total_price).sort((a,b) => a-b);
        rankMap[rfqId] = { rank: (allP.indexOf(myPrice) + 1) || 1, totalBids: allP.length, myPrice };
      }
    });

    // Unread messages
    const { data: unreadMsgs } = await _supabase.from('messages').select('rfq_id').in('rfq_id', myBidRfqIds).eq('recipient_id', userId).eq('read', false);
    const unreadByRfq = {};
    (unreadMsgs || []).forEach(m => { unreadByRfq[m.rfq_id] = (unreadByRfq[m.rfq_id] || 0) + 1; });
    const totalUnread = Object.values(unreadByRfq).reduce((a,b) => a+b, 0);
    if (totalUnread > 0) { const b = document.getElementById('badge-messages'); if (b) { b.textContent = totalUnread; b.style.display = ''; } }

    // Build MY_BIDS
    MY_BIDS = bidRows.map(b => {
      const rfq = rfqMap[b.rfq_id];
      const rfqStatus = rfq?.status;
      let bidStatus;
      if (rfqStatus === 'cancelled' || b.status === 'cancelled') bidStatus = 'cancelled';
      else if (rfq?.strategy === 'split' && rfq?.vendor_awards) {
        const awardedIds = Object.values(rfq.vendor_awards);
        if (awardedIds.includes(b.id)) bidStatus = 'won';
        else if (rfqStatus === 'awarded' || rfqStatus === 'closed') bidStatus = 'lost';
        else bidStatus = 'pending';
      } else {
        if (b.status === 'accepted') bidStatus = 'won';
        else if (b.status === 'rejected') bidStatus = 'lost';
        else if (rfqStatus === 'awarded' || rfqStatus === 'closed') bidStatus = 'lost';
        else bidStatus = 'pending';
      }
      const awardedVendors = (function() {
        if (!rfq || rfq.strategy !== 'split' || !rfq.vendor_awards) return null;
        const won = [];
        for (var v in rfq.vendor_awards) { if (rfq.vendor_awards[v] === b.id) won.push(v); }
        return won.length > 0 ? won : null;
      })();
      const ri = rankMap[b.rfq_id] || {};
      return {
        id: b.id, rfqId: b.rfq_id,
        title: rfq ? rfq.title : 'RFQ #' + b.rfq_id.slice(0,8).toUpperCase(),
        vendor: rfq ? rfq.vendor : '—',
        description: rfq ? rfq.description : '',
        location: rfq ? rfq.location : '—',
        deadline: rfq ? rfq.deadline : null,
        strategy: rfq ? rfq.strategy : 'sole',
        myPrice: b.total_price || 0,
        rank: ri.rank || 1, bestRank: ri.bestRank || ri.rank || 1,
        totalBids: ri.totalBids || 1,
        isSplitRank: ri.isSplit || false,
        vendorRanks: ri.vendorRanks || null,
        status: bidStatus,
        awardedVendors,
        submittedAt: b.created_at ? b.created_at.slice(0,10) : null,
        lineItems: b.line_items || null,
        notes: b.notes || '',
        buyerId: rfq ? rfq.buyerId : null,
        unreadMessages: unreadByRfq[b.rfq_id] || 0,
      };
    });

    const activeBids = MY_BIDS.filter(b => b.status === 'pending');
    const wonBids = MY_BIDS.filter(b => b.status === 'won');
    const lostBids = MY_BIDS.filter(b => b.status === 'lost');
    const cancelledBids = MY_BIDS.filter(b => b.status === 'cancelled');
    updateTabCounts(activeBids, wonBids, lostBids, cancelledBids);

    if (activeBids.length > 0) { const b = document.getElementById('badge-bids'); if (b) { b.textContent = activeBids.length; b.style.display = ''; } }

    document.getElementById('topbar-sub').textContent = MY_BIDS.length + ' total bid' + (MY_BIDS.length !== 1 ? 's' : '') + ' · ' + activeBids.length + ' active';
    renderCurrentTab();

    const urlBidId = new URLSearchParams(window.location.search).get('bid');
    if (urlBidId) {
      const target = MY_BIDS.find(b => b.id === urlBidId);
      if (target) {
        if (target.status === 'pending') {
          openBidForm(target.rfqId, target.title);
        } else {
          const tabMap = { won: 'won', lost: 'lost', cancelled: 'cancelled' };
          const tab = tabMap[target.status] || 'active';
          setTab(tab);
          setTimeout(function() {
            const card = document.getElementById('bid-card-' + urlBidId);
            if (card) {
              card.scrollIntoView({ behavior: 'smooth', block: 'center' });
              card.classList.add('deep-linked');
            }
          }, 80);
        }
      }
    }
  }

  function updateTabCounts(active, won, lost, cancelled) {
    document.getElementById('count-active').textContent = active.length;
    document.getElementById('count-won').textContent = won.length;
    document.getElementById('count-lost').textContent = lost.length;
    document.getElementById('count-cancelled').textContent = cancelled.length;
  }

  function setTab(tab) {
    _currentTab = tab;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    const el = document.getElementById('tab-' + tab);
    if (el) el.classList.add('active');
    renderCurrentTab();
  }

  function renderCurrentTab() {
    const list = document.getElementById('bids-list');
    const statusMap = { active: 'pending', won: 'won', lost: 'lost', cancelled: 'cancelled' };
    const filtered = MY_BIDS.filter(b => b.status === statusMap[_currentTab]);
    if (!filtered.length) {
      const labels = { active: 'active bids', won: 'won bids', lost: 'lost bids', cancelled: 'cancelled bids' };
      list.innerHTML = '<div class="empty-state"><h3>No ' + labels[_currentTab] + '</h3>' +
        (_currentTab === 'active' ? '<p>Submit a bid on an open RFQ to see it here.</p><a href="bidbridge-reseller-open-rfqs.html" class="empty-cta">Browse open RFQs →</a>' : '') +
        '</div>';
      return;
    }
    list.innerHTML = filtered.map(bid => renderBidCard(bid)).join('');
  }

  function buildRankDisplay(isSplitRank, vendorRanks, rank, rankNudge) {
    if (isSplitRank && vendorRanks) {
      const pills = Object.entries(vendorRanks).map(([vendor, info]) => {
        const isFirst = info.rank === 1;
        const bg = isFirst ? 'rgba(37,99,235,0.1)' : 'rgba(217,119,6,0.1)';
        const border = isFirst ? 'rgba(37,99,235,0.3)' : 'rgba(217,119,6,0.3)';
        const color = isFirst ? 'var(--accent)' : 'var(--gold)';
        const shortV = vendor.length > 14 ? vendor.split(' ')[0] : vendor;
        return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:' + bg + ';border:1px solid ' + border + ';color:' + color + ';">' + (isFirst ? '✓' : '⚠') + ' ' + shortV + ' #' + info.rank + '</span>';
      }).join('');
      return '<span style="display:inline-flex;flex-wrap:wrap;gap:5px;">' + pills + '</span>';
    }
    return '<span style="font-size:12px;color:var(--text-muted);">' + (rank === 1 ? "You're #1 — lowest bid" : rank === 2 ? "You're in 2nd place" : "You're ranked #" + rank) + '</span>';
  }

  function renderBidCard(bid) {
    const safeTitle = bid.title.replace(/'/g, '&#39;');
    const vendorTags = bid.vendor && bid.vendor !== '—' ? bid.vendor.split(' · ').map(v => '<span class="rfq-tag vendor">' + v + '</span>').join('') : '';

    if (bid.status === 'won') {
      const isPartialWin = bid.strategy === 'split' && bid.awardedVendors?.length > 0 && bid.lineItems?.some(li => li.vendor && !bid.awardedVendors.includes(li.vendor));
      const wonPrice = (isPartialWin && bid.lineItems)
        ? bid.lineItems.filter(li => !li.vendor || bid.awardedVendors.includes(li.vendor)).reduce((s, li) => s + parseFloat(li.line_total || (parseFloat(li.unit_price || 0) * (li.quantity || 1))), 0)
        : bid.myPrice;
      return '<div id="bid-card-' + bid.id + '" class="rfq-card" style="border-color:rgba(5,150,105,0.35);background:rgba(5,150,105,0.02);" onclick="openBidReadOnly(\'' + bid.id + '\')">' +
        '<div class="new-tag" style="background:var(--success);color:#fff;">' + (isPartialWin ? '🏆 PARTIAL WIN' : '🏆 WON') + '</div>' +
        '<div class="rfq-card-top"><div>' +
          '<div class="rfq-card-title">RFQ #' + bid.rfqId.slice(0,8).toUpperCase() + ' — ' + bid.title + '</div>' +
          '<div class="rfq-card-sub">' + bid.description + '</div>' +
        '</div></div>' +
        '<div class="bid-status-bar" style="background:rgba(5,150,105,0.05);border-color:rgba(5,150,105,0.2);">' +
          '<span style="font-size:13px;color:var(--success);font-weight:600;">' + (isPartialWin ? '✓ You won the ' + bid.awardedVendors.join(' & ') + ' portion' : '✓ Your bid was selected!') + '</span>' +
          '<span style="font-size:12px;color:var(--text-muted);">Awarded: <strong style="color:var(--success);">$' + wonPrice.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</strong> · Submitted ' + (bid.submittedAt || '—') + '</span>' +
        '</div>' +
        '<div class="rfq-card-footer"><div class="rfq-tags">' + vendorTags + '</div>' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
            '<button class="btn-msg-small" onclick="event.stopPropagation();openMsg(\'' + bid.rfqId + '\')">💬 Message buyer' + (bid.unreadMessages > 0 ? ' <span class="unread-badge">' + bid.unreadMessages + '</span>' : '') + '</button>' +
            '<button class="btn-bid" style="background:var(--success);" onclick="event.stopPropagation();openBidReadOnly(\'' + bid.id + '\')">View details</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    if (bid.status === 'lost') {
      return '<div id="bid-card-' + bid.id + '" class="rfq-card" style="border-color:rgba(156,163,175,0.3);opacity:0.85;" onclick="openBidReadOnly(\'' + bid.id + '\')">' +
        '<div class="new-tag" style="background:rgba(156,163,175,0.25);color:var(--text-muted);">NOT SELECTED</div>' +
        '<div class="rfq-card-top"><div>' +
          '<div class="rfq-card-title">RFQ #' + bid.rfqId.slice(0,8).toUpperCase() + ' — ' + bid.title + '</div>' +
          '<div class="rfq-card-sub">' + bid.description + '</div>' +
        '</div></div>' +
        '<div class="bid-status-bar" style="background:rgba(156,163,175,0.05);border-color:rgba(156,163,175,0.15);">' +
          '<span style="font-size:13px;color:var(--text-muted);">This RFQ was awarded to another reseller</span>' +
          '<span style="font-size:12px;color:var(--text-light);">Your bid: <strong>$' + bid.myPrice.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</strong> · Submitted ' + (bid.submittedAt || '—') + '</span>' +
        '</div>' +
        '<div class="rfq-card-footer"><div class="rfq-tags">' + vendorTags + '</div><span style="font-size:13px;color:var(--text-light);">Bid closed</span></div>' +
      '</div>';
    }

    if (bid.status === 'cancelled') {
      return '<div id="bid-card-' + bid.id + '" class="rfq-card" style="border-color:rgba(220,38,38,0.2);opacity:0.75;" onclick="openBidReadOnly(\'' + bid.id + '\')">' +
        '<div class="new-tag" style="background:rgba(220,38,38,0.1);color:var(--error);">CANCELLED</div>' +
        '<div class="rfq-card-top"><div>' +
          '<div class="rfq-card-title">RFQ #' + bid.rfqId.slice(0,8).toUpperCase() + ' — ' + bid.title + '</div>' +
          '<div class="rfq-card-sub">' + bid.description + '</div>' +
        '</div></div>' +
        '<div class="bid-status-bar" style="background:rgba(220,38,38,0.04);border-color:rgba(220,38,38,0.15);">' +
          '<span style="font-size:13px;color:var(--error);">🚫 This RFQ was cancelled by the buyer</span>' +
          '<span style="font-size:12px;color:var(--text-light);">Your bid: <strong>$' + bid.myPrice.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</strong></span>' +
        '</div>' +
        '<div class="rfq-card-footer"><div class="rfq-tags">' + vendorTags + '</div><span style="font-size:13px;color:var(--error);">RFQ cancelled</span></div>' +
      '</div>';
    }

    // Active / pending
    const days = daysUntil(bid.deadline);
    const dlClass = days <= 2 ? 'deadline-urgent' : days <= 5 ? 'deadline-soon' : 'deadline-ok';
    const dlLabel = days <= 0 ? 'Deadline passed' : days === 1 ? 'Closes tomorrow' : (days + ' days left');
    const effectiveRank = bid.isSplitRank ? (bid.bestRank || bid.rank) : bid.rank;
    const isLeading = effectiveRank === 1;
    const bidColorRgb = isLeading ? '37,99,235' : '217,119,6';
    const bidColor = isLeading ? 'var(--accent)' : 'var(--gold)';
    let rankNudge = bid.rank === 1 ? 'Looking good!' : 'Consider revising.';
    if (bid.isSplitRank && bid.vendorRanks) {
      const allFirst = Object.values(bid.vendorRanks).every(v => v.rank === 1);
      rankNudge = allFirst ? 'Leading on all!' : "Revise where you're not #1.";
    }
    return '<div id="bid-card-' + bid.id + '" class="rfq-card" style="border-color:rgba(' + bidColorRgb + ',0.3);" onclick="openBidForm(\'' + bid.rfqId + '\', \'' + safeTitle + '\')">' +
      '<div class="new-tag" style="background:rgba(' + bidColorRgb + ',1);color:#fff;">BID SUBMITTED</div>' +
      '<div class="rfq-card-top"><div>' +
        '<div class="rfq-card-title">RFQ #' + bid.rfqId.slice(0,8).toUpperCase() + ' — ' + bid.title + '</div>' +
        '<div class="rfq-card-sub">' + bid.description + '</div>' +
      '</div></div>' +
      '<div class="bid-status-bar" style="background:rgba(' + bidColorRgb + ',0.06);border-color:rgba(' + bidColorRgb + ',0.2);">' +
        '<div class="bid-status-left">' +
          '<span class="bid-status-badge" style="background:rgba(' + bidColorRgb + ',0.1);color:' + bidColor + ';border-color:rgba(' + bidColorRgb + ',0.25);">✓ Bid submitted</span>' +
          buildRankDisplay(bid.isSplitRank, bid.vendorRanks, effectiveRank, rankNudge) +
        '</div>' +
        '<span style="font-size:12px;color:var(--text-muted);">$' + bid.myPrice.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' · ' + (bid.submittedAt || '—') + '</span>' +
      '</div>' +
      '<div class="rfq-card-footer">' +
        '<div class="rfq-tags">' + vendorTags +
          '<span class="rfq-tag strategy">' + (bid.strategy === 'split' ? 'Split bid' : 'Sole source') + '</span>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<span class="deadline-label ' + dlClass + '">⏱ ' + dlLabel + '</span>' +
          '<button class="btn-msg-small" onclick="event.stopPropagation();openMsg(\'' + bid.rfqId + '\')">💬 Message' + (bid.unreadMessages > 0 ? ' <span class="unread-badge">' + bid.unreadMessages + '</span>' : '') + '</button>' +
          '<button class="btn-bid" style="background:transparent;border:1px solid rgba(' + bidColorRgb + ',0.4);color:' + bidColor + ';" onclick="event.stopPropagation();openBidForm(\'' + bid.rfqId + '\', \'' + safeTitle + '\')">↻ Revise bid</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function openMsg(rfqId) {
    window.location.href = 'bidbridge-reseller-messages.html?rfq=' + rfqId;
  }

  /* BID FORM (for revisions from active bids) */
  async function openBidForm(rfqId, title) {
    _currentBidRfqId = rfqId;
    _currentBidItems = [];
    const bg = document.getElementById('bid-modal-bg');
    const body = document.getElementById('bid-modal-body');
    const footer = document.getElementById('bid-modal-footer');
    const existingBid = MY_BIDS.find(b => b.rfqId === rfqId);
    document.getElementById('bid-modal-title').textContent = 'Revise Bid';
    document.getElementById('bid-modal-subtitle').textContent = 'RFQ — ' + title;
    body.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">Loading line items…</p>';
    footer.style.display = 'none';
    bg.classList.remove('hidden');
    const authCb = document.getElementById('bid-auth-checkbox'); if (authCb) authCb.checked = false;
    const submitBtn = document.getElementById('bid-submit-btn'); if (submitBtn) submitBtn.disabled = true;

    const [{ data: rawItems, error }, { data: rfqMeta }] = await Promise.all([
      _supabase.from('rfq_items').select('id, vendor, sku, quantity, description').eq('rfq_id', rfqId).order('vendor'),
      _supabase.from('rfqs').select('sku_updated_at, strategy, notes').eq('id', rfqId).single(),
    ]);
    if (error || !rawItems?.length) {
      body.innerHTML = '<p style="color:var(--error);">Could not load line items. Please try again.</p>';
      footer.innerHTML = '<button class="btn-cancel-bid" onclick="closeBidModal()">Close</button>';
      footer.style.display = 'flex';
      return;
    }

    const isSplitBid = rfqMeta?.strategy === 'split';
    const myVendorNames = _MY_AUTHORIZED_VENDORS.map(v => v.vendor);
    const items = isSplitBid ? rawItems.filter(i => myVendorNames.includes(i.vendor)) : rawItems;
    if (isSplitBid && items.length === 0) {
      body.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">None of the vendors in this RFQ match your authorized vendor list.</p>';
      footer.innerHTML = '<button class="btn-cancel-bid" onclick="closeBidModal()">Close</button>';
      footer.style.display = 'flex'; return;
    }

    const prevPriceMap = {}, prevQtyMap = {};
    if (existingBid?.lineItems) {
      existingBid.lineItems.forEach(li => { const key = (li.vendor||'') + '|' + (li.sku||''); prevPriceMap[key] = li.unit_price; prevQtyMap[key] = li.quantity; });
    }
    const existingItems = items.filter(i => !!prevPriceMap[i.vendor+'|'+i.sku]);
    const newItems = items.filter(i => !prevPriceMap[i.vendor+'|'+i.sku]);
    _currentBidItems = existingItems.concat(newItems);
    footer.style.display = 'flex';
    footer.querySelector('#bid-error').style.display = 'none';

    const rank = existingBid ? (existingBid.rank || 1) : 1;
    const prevPrice = existingBid ? existingBid.myPrice : 0;
    const isLeading = rank === 1;
    const c = isLeading ? '37,99,235' : '217,119,6';
    const nudgeBanner = '<div style="background:rgba(' + c + ',0.06);border:1px solid rgba(' + c + ',0.2);border-radius:9px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--text-muted);"><span style="color:rgba(' + c + ',1);font-weight:600;margin-right:6px;">' + (isLeading ? '✓' : '⚠') + '</span>' + (isLeading ? 'You\'re <strong>#1 — the lowest bid</strong> at $' + prevPrice.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '.' : 'You\'re <strong>not in first place</strong>. Submit a lower price to move up.') + '</div>';
    const buyerNotesHtml = rfqMeta?.notes ? '<div style="background:rgba(37,99,235,0.04);border:1px solid rgba(37,99,235,0.15);border-radius:9px;padding:12px 16px;margin-bottom:16px;"><div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px;">Buyer Notes</div><div style="font-size:13px;color:var(--text-muted);">' + rfqMeta.notes.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div></div>' : '';

    function buildRows(subset, startIdx, isNew) {
      return subset.map((item, i) => {
        const idx = startIdx + i;
        const key = item.vendor + '|' + item.sku;
        const prevVal = prevPriceMap[key] ? prevPriceMap[key].toFixed(2) : '';
        return '<tr><td style="color:var(--text-muted);font-size:12px;">' + item.vendor + '</td>' +
          '<td><span class="sku-part">' + item.sku + '</span>' + (isNew ? '<span style="font-size:10px;font-weight:700;background:rgba(37,99,235,0.1);color:var(--accent);border:1px solid rgba(37,99,235,0.25);padding:1px 7px;border-radius:999px;margin-left:6px;">NEW</span>' : '') + '</td>' +
          '<td class="sku-qty">' + item.quantity + '</td>' +
          '<td><div class="sku-price-wrap"><span style="color:var(--text-muted);">$</span><input class="sku-price-input" id="price-' + idx + '" type="number" min="0" step="0.01" placeholder="0.00" value="' + prevVal + '" oninput="recalcBidTotal()"></div>' + (prevVal ? '<div style="font-size:11px;color:var(--text-light);margin-top:3px;">Last: $' + parseFloat(prevVal).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</div>' : '') + '</td>' +
          '<td class="sku-line-total" id="line-total-' + idx + '">' + (prevVal ? '$' + (parseFloat(prevVal) * item.quantity).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—') + '</td></tr>';
      }).join('');
    }
    body.innerHTML = nudgeBanner + buyerNotesHtml +
      '<p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">Update your unit prices below. The total updates automatically.</p>' +
      '<table class="sku-table"><thead><tr><th>Vendor</th><th>Part #</th><th style="text-align:center;">Qty</th><th class="right">Unit price</th><th class="right">Line total</th></tr></thead><tbody>' +
      buildRows(existingItems, 0, false) +
      (newItems.length ? '<tr><td colspan="5" style="padding:12px 0 6px;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.07em;border-top:1px solid rgba(37,99,235,0.15);">New items</td></tr>' + buildRows(newItems, existingItems.length, true) : '') +
      '</tbody></table>' +
      '<hr class="bid-divider"><div class="bid-total-row"><span class="bid-total-label">Net total</span><span class="bid-total-value" id="bid-net-total">$0.00</span></div><hr class="bid-divider">' +
      '<div style="margin-top:14px;"><div class="bid-notes-label">Notes to buyer (optional)</div><textarea class="bid-notes-input" id="bid-notes" placeholder="Lead time, availability, warranty terms…">' + (existingBid ? (existingBid.notes || '') : '') + '</textarea></div>';
    recalcBidTotal();
  }

  function recalcBidTotal() {
    let total = 0;
    _currentBidItems.forEach((item, idx) => {
      const unit = parseFloat(document.getElementById('price-' + idx)?.value) || 0;
      const lt = unit * item.quantity;
      const el = document.getElementById('line-total-' + idx); if (el) el.textContent = unit > 0 ? '$' + lt.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
      total += lt;
    });
    const el = document.getElementById('bid-net-total'); if (el) el.textContent = '$' + total.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  }

  async function submitBid() {
    const btn = document.getElementById('bid-submit-btn');
    const errEl = document.getElementById('bid-error');
    errEl.style.display = 'none';
    const prices = _currentBidItems.map((_, idx) => parseFloat(document.getElementById('price-' + idx)?.value) || 0);
    if (prices.some(p => p <= 0)) { errEl.textContent = 'Please enter a price for every line item.'; errEl.style.display = 'block'; return; }
    const netTotal = prices.reduce((sum, p, idx) => sum + p * _currentBidItems[idx].quantity, 0);
    const notes = document.getElementById('bid-notes')?.value?.trim() || null;
    btn.disabled = true; btn.textContent = 'Submitting…';
    const { data: { session } } = await _supabase.auth.getSession();
    const lineItems = _currentBidItems.map((item, idx) => ({ rfq_item_id: item.id, vendor: item.vendor, sku: item.sku, quantity: item.quantity, unit_price: prices[idx], line_total: prices[idx] * item.quantity }));
    const { data: upsertResult, error } = await _supabase.from('bids').upsert({ rfq_id: _currentBidRfqId, reseller_id: session.user.id, total_price: netTotal, notes, line_items: lineItems, status: 'pending' }, { onConflict: 'rfq_id,reseller_id' }).select('id').single();
    if (error) { btn.disabled = false; btn.textContent = 'Submit bid →'; errEl.textContent = 'Error: ' + error.message; errEl.style.display = 'block'; return; }
    try { if (upsertResult?.id) await _supabase.from('bid_history').insert({ bid_id: upsertResult.id, rfq_id: _currentBidRfqId, reseller_id: session.user.id, total_price: netTotal, line_items: lineItems }); } catch(e) {}
    document.getElementById('bid-modal-footer').style.display = 'none';
    document.getElementById('bid-modal-body').innerHTML = '<div class="bid-success"><div class="bid-success-icon">✅</div><div class="bid-success-title">Bid updated!</div><div class="bid-success-sub">Your revised bid of <strong style="color:var(--accent);">$' + netTotal.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</strong> has been submitted.</div><button class="btn-submit-bid" style="margin-top:20px;" onclick="closeBidModal();window.location.reload()">Done</button></div>';
  }

  function closeBidModal() { document.getElementById('bid-modal-bg').classList.add('hidden'); _currentBidRfqId = null; _currentBidItems = []; }

  /* BID READ-ONLY DETAIL */
  function openBidReadOnly(bidId) {
    const bid = MY_BIDS.find(b => b.id === bidId);
    if (!bid) return;
    const bg = document.getElementById('bid-modal-bg');
    const body = document.getElementById('bid-modal-body');
    const footer = document.getElementById('bid-modal-footer');
    const isSplitWin = bid.status === 'won' && bid.strategy === 'split' && bid.awardedVendors?.length > 0;
    const awardedSet = isSplitWin ? new Set(bid.awardedVendors) : null;
    const isPartialWin = isSplitWin && bid.lineItems?.some(li => li.vendor && !awardedSet.has(li.vendor));
    const displayItems = (isSplitWin && bid.lineItems) ? bid.lineItems.filter(li => !li.vendor || awardedSet.has(li.vendor)) : bid.lineItems;
    const displayTotal = (isSplitWin && displayItems?.length) ? displayItems.reduce((s, li) => s + parseFloat(li.line_total || (parseFloat(li.unit_price||0) * (li.quantity||1))), 0) : bid.myPrice;
    document.getElementById('bid-modal-title').textContent = 'Bid Summary';
    document.getElementById('bid-modal-subtitle').textContent = 'RFQ #' + bid.rfqId.slice(0,8).toUpperCase() + ' — ' + bid.title;
    footer.innerHTML = '<div style="display:flex;gap:8px;justify-content:flex-end;width:100%;"><button class="btn-cancel-bid" onclick="closeBidModal()">Close</button>' + (bid.status === 'pending' ? '<button class="btn-bid" onclick="closeBidModal();openBidForm(\'' + bid.rfqId + '\', \'' + bid.title.replace(/'/g,"&#39;") + '\')">↻ Revise bid</button>' : '') + '</div>';
    footer.style.display = 'flex';
    let statusLabel = bid.status === 'won' ? (isPartialWin ? '🏆 Partially Won' : '🏆 Won') : bid.status === 'cancelled' ? '🚫 Cancelled' : bid.status === 'lost' ? '📋 Not Selected' : '⏳ Pending';
    let statusColor = bid.status === 'won' ? 'var(--success)' : bid.status === 'cancelled' ? 'var(--error)' : bid.status === 'lost' ? 'var(--text-muted)' : 'var(--gold)';
    const lineItems = displayItems;
    let tableHtml = '';
    if (lineItems?.length) {
      const rows = lineItems.map(item => {
        const qty = item.quantity || 1, unit = item.unit_price || 0, lt = item.line_total || (qty * unit);
        return '<tr><td style="padding:9px 7px;color:var(--text-muted);font-size:13px;">' + (item.vendor||'—') + '</td><td style="padding:9px 7px;"><span class="sku-part">' + (item.sku||'—') + '</span></td><td style="padding:9px 7px;text-align:center;">' + qty + '</td><td style="padding:9px 7px;text-align:right;">$' + parseFloat(unit).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</td><td style="padding:9px 7px;text-align:right;font-weight:600;">$' + parseFloat(lt).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</td></tr>';
      }).join('');
      tableHtml = '<table style="width:100%;border-collapse:collapse;"><thead><tr style="border-bottom:1px solid var(--border);"><th style="padding:7px;text-align:left;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Vendor</th><th style="padding:7px;text-align:left;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Part #</th><th style="padding:7px;text-align:center;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Qty</th><th style="padding:7px;text-align:right;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Unit Price</th><th style="padding:7px;text-align:right;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Line Total</th></tr></thead><tbody>' + rows + '</tbody></table>';
    } else tableHtml = '<p style="color:var(--text-muted);font-size:13px;">No line item detail available.</p>';
    body.innerHTML =
      '<div style="display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;">' +
        '<div style="flex:1;min-width:110px;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:13px 15px;"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;">Status</div><div style="font-size:15px;font-weight:600;color:' + statusColor + ';">' + statusLabel + '</div></div>' +
        '<div style="flex:1;min-width:110px;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:13px 15px;"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;">' + (isPartialWin ? 'Awarded' : 'Total Bid') + '</div><div style="font-size:18px;font-weight:700;color:var(--accent);">$' + displayTotal.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</div></div>' +
        '<div style="flex:1;min-width:110px;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:13px 15px;"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;">Submitted</div><div style="font-size:14px;font-weight:500;color:var(--text);">' + (bid.submittedAt || '—') + '</div></div>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Line items</div>' +
      '<div style="background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;overflow:hidden;padding:4px 8px;">' +
        tableHtml +
        '<div style="border-top:1px solid var(--border);padding:9px 7px;text-align:right;font-size:14px;color:var(--text-muted);">Net total: <strong style="color:var(--accent);font-size:16px;margin-left:8px;">$' + displayTotal.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</strong></div>' +
      '</div>' +
      (bid.notes ? '<div style="margin-top:14px;"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;">Notes</div><div style="font-size:13px;color:var(--text-muted);background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:9px 13px;">' + bid.notes.replace(/</g,'&lt;') + '</div></div>' : '');
    bg.classList.remove('hidden');

    if (bid.status === 'won') {
      body.insertAdjacentHTML('beforeend', '<div id="won-contact" style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:7px;">Buyer Contact</div><div style="font-size:13px;color:var(--text-muted);">Loading…</div></div>');
      (async () => {
        try {
          const rfqRes = await _supabase.from('rfqs').select('buyer_id').eq('id', bid.rfqId).single();
          const buyerId = rfqRes?.data?.buyer_id; if (!buyerId) { document.getElementById('won-contact')?.remove(); return; }
          const profRes = await _supabase.from('profiles').select('first_name, last_name, company').eq('id', buyerId).single();
          const p = profRes?.data; if (!p) { document.getElementById('won-contact')?.remove(); return; }
          const name = [p.first_name, p.last_name].filter(Boolean).join(' ') || '—';
          const el = document.getElementById('won-contact');
          if (el) el.innerHTML = '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:9px;">Next Steps — Buyer Contact</div><div style="background:rgba(5,150,105,0.05);border:1px solid rgba(5,150,105,0.2);border-radius:10px;padding:13px 16px;display:flex;gap:16px;align-items:center;"><div style="font-size:22px;">🏆</div><div><div style="font-size:14px;font-weight:600;color:var(--text);">' + name + '</div><div style="font-size:13px;color:var(--text-muted);">' + (p.company || '—') + '</div></div><div style="font-size:12px;color:var(--text-muted);flex:1;">Reach out to schedule a PO and fulfillment call.</div></div>';
        } catch(e) { document.getElementById('won-contact')?.remove(); }
      })();
    }
  }

  /* NOTIFICATION PANEL */
  function updateNotifBadge() {
    const unread = _ALL_NOTIFS.filter(n => !n.read && !_notifDismissed.includes(n.id));
    [document.getElementById('notif-badge'), document.getElementById('notif-badge-top'), document.getElementById('notif-drawer-badge')].forEach(b => { if (b) { b.textContent = unread.length; b.style.display = unread.length > 0 ? '' : 'none'; } });
    const lbl = document.getElementById('notif-unread-label'); if (lbl) lbl.textContent = unread.length > 0 ? unread.length + ' unread' : 'All caught up';
  }
  function getNotifIcon(type) { return ({ new_rfq:'📋', bid_won:'🏆', bid_lost:'📋', bid_submitted:'💼', rfq_updated:'✏️', rfq_cancelled:'🚫', new_message:'💬', rank_changed:'📈' })[type] || '🔔'; }
  function getNotifAccent(type) { if (type === 'bid_won' || type === 'new_message') return 'accent'; if (type === 'rfq_cancelled' || type === 'bid_lost') return 'error'; return 'gold'; }
  function renderNotifList() {
    const list = document.getElementById('notif-list'); if (!list) return;
    if (!_ALL_NOTIFS.length) { list.innerHTML = '<div class="notif-empty"><div class="notif-empty-icon">🔔</div>No notifications yet</div>'; return; }
    list.innerHTML = _ALL_NOTIFS.map(n => {
      const isUnread = !n.read && !_notifDismissed.includes(n.id);
      const accent = getNotifAccent(n.type);
      return '<div class="notif-item' + (isUnread ? ' unread' + (accent !== 'accent' ? ' unread-' + accent : '') : '') + '" onclick="handleNotifClick(\'' + n.id + '\', \'' + n.type + '\')">' +
        (isUnread ? '<div class="notif-dot ' + (accent !== 'accent' ? accent : '') + '"></div>' : '<div style="width:7px;flex-shrink:0;"></div>') +
        '<div class="notif-icon">' + getNotifIcon(n.type) + '</div>' +
        '<div class="notif-body"><div class="notif-msg">' + (n.message || '').replace(/</g,'&lt;') + '</div><div class="notif-time">' + notifTimeAgo(n.created_at) + '</div></div></div>';
    }).join('');
  }
  function openNotifPanel() { document.getElementById('notif-drawer').classList.add('open'); document.getElementById('notif-backdrop').classList.add('open'); updateNotifBadge(); renderNotifList(); }
  function closeNotifPanel() { document.getElementById('notif-drawer').classList.remove('open'); document.getElementById('notif-backdrop').classList.remove('open'); }
  function handleNotifClick(id, type) {
    const notif = _ALL_NOTIFS.find(n => n.id === id);
    if (notif && !notif.read) { notif.read = true; _notifDismissed = [...new Set([..._notifDismissed, id])]; localStorage.setItem(_notifDismissedKey, JSON.stringify(_notifDismissed)); _supabase.from('notifications').update({ read: true }).eq('id', id); updateNotifBadge(); renderNotifList(); }
    closeNotifPanel();
    if (type === 'new_rfq' || type === 'rfq_updated') window.location.href = 'bidbridge-reseller-open-rfqs.html';
    else if (type === 'new_message') window.location.href = 'bidbridge-reseller-messages.html';
  }
  function markAllNotifsRead() {
    const ids = _ALL_NOTIFS.filter(n => !n.read).map(n => n.id); if (!ids.length) return;
    _ALL_NOTIFS.forEach(n => n.read = true); _notifDismissed = [...new Set([..._notifDismissed, ...ids])];
    localStorage.setItem(_notifDismissedKey, JSON.stringify(_notifDismissed));
    _supabase.from('notifications').update({ read: true }).in('id', ids);
    updateNotifBadge(); renderNotifList();
  }

  /* INIT */
  (async () => {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.href = 'bidbridge-auth_1.html'; return; }
    await loadPage(session);
  })();
</script>
</body>
</html>
