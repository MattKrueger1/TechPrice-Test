<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Pricing Network — Executive Summary</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --surface-alt: #F0F2F5;
    --border: #E5E7EB;
    --accent: #2563EB;
    --accent-dim: #1D4ED8;
    --accent-bg: #EFF6FF;
    --gold: #D97706;
    --error: #DC2626;
    --success: #059669;
    --text: #111827;
    --text-muted: #6B7280;
    --text-light: #9CA3AF;
    --navy: #1E2337;
    --white: #111827;
    --slate: #6B7280;
    --slate-light: #9CA3AF;
  }

  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.6; }

  /* ── SCREEN TOOLBAR ── */
  .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: var(--navy); border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 10; }
  .toolbar-left { display: flex; align-items: center; gap: 16px; }
  .toolbar-logo { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; color: #EEF2FF; text-decoration: none; letter-spacing: -0.5px; }
  .toolbar-logo span { color: #818CF8; }
  .btn-back { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; background: transparent; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; color: rgba(255,255,255,0.7); font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; text-decoration: none; transition: all .2s; }
  .btn-back:hover { border-color: rgba(255,255,255,0.35); color: #fff; }
  .toolbar-actions { display: flex; gap: 10px; }
  .btn-print { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; background: var(--accent); border: none; border-radius: 9px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s; }
  .btn-print:hover { background: var(--accent-dim); }

  /* ── DOCUMENT WRAPPER ── */
  .doc-wrap { max-width: 860px; margin: 40px auto; padding: 0 40px 80px; }

  /* ── HEADER ── */
  .doc-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 40px; padding-bottom: 28px; border-bottom: 2px solid var(--border); }
  .doc-logo-block { display: flex; flex-direction: column; gap: 4px; }
  .doc-logo { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
  .doc-logo span { color: var(--accent); }
  .doc-logo-sub { font-size: 12px; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
  .doc-meta { text-align: right; }
  .doc-meta-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
  .doc-meta-value { font-size: 13px; color: var(--text); }

  /* ── TITLE BLOCK ── */
  .doc-title-block { margin-bottom: 36px; }
  .doc-eyebrow { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; }
  .doc-title { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.8px; color: var(--text); margin-bottom: 8px; line-height: 1.2; }
  .doc-subtitle { font-size: 15px; color: var(--text-muted); }

  /* ── THANK YOU ── */
  .thank-you-card { background: var(--accent-bg); border: 1px solid #BFDBFE; border-radius: 14px; padding: 28px 30px; margin-bottom: 32px; }
  .thank-you-card p { font-size: 15px; color: var(--text); line-height: 1.8; }
  .thank-you-card p + p { margin-top: 12px; }

  /* ── SECTION HEADERS ── */
  .section-label { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

  /* ── STAT GRID ── */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; }
  .stat-box.accent { border-color: #BFDBFE; background: var(--accent-bg); }
  .stat-box.gold { border-color: #FDE68A; background: #FFFBEB; }
  .stat-box-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
  .stat-box-value { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
  .stat-box.accent .stat-box-value { color: var(--accent); }
  .stat-box.gold .stat-box-value { color: var(--gold); }
  .stat-box-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ── BID BREAKDOWN TABLE ── */
  .bid-table { width: 100%; border-collapse: collapse; margin-bottom: 32px; }
  .bid-table th { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; padding: 10px 16px; text-align: left; border-bottom: 2px solid var(--border); background: var(--surface-alt); }
  .bid-table td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid var(--border); color: var(--text); }
  .bid-table tr:last-child td { border-bottom: none; }
  .bid-table tr.winner-row td { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .winner-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-bg); border: 1px solid #BFDBFE; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 700; color: var(--accent); margin-left: 8px; }

  /* ── SAVINGS SECTION ── */
  .savings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
  .savings-box { background: var(--surface); border: 1px solid #A7F3D0; border-radius: 12px; padding: 22px; text-align: center; }
  .savings-box-value { font-family: 'Inter', sans-serif; font-size: 36px; font-weight: 800; color: var(--success); letter-spacing: -1px; }
  .savings-box-label { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }

  /* ── FOOTER ── */
  .doc-footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .doc-footer-left { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
  .doc-footer-right { font-size: 12px; color: var(--text-muted); text-align: right; }

  /* ── LOADING / ERROR ── */
  .loading-state { text-align: center; padding: 80px 40px; color: var(--text-muted); }
  .loading-spinner { font-size: 32px; margin-bottom: 16px; animation: spin 1.5s linear infinite; display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── PRINT STYLES ── */
  @media print {
    @page { margin: 20mm 18mm; }
    html, body { background: #fff !important; color: #111 !important; font-size: 13px; }
    .toolbar { display: none !important; }
    .doc-wrap { max-width: 100%; margin: 0; padding: 0; }
    .doc-logo span { color: #2563EB !important; }
    .stat-box-value, .savings-box-value { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .thank-you-card, .stat-box, .savings-box { border: 1px solid #E5E7EB !important; background: #F7F8FA !important; }
    .stat-box.accent { background: #EFF6FF !important; }
    .stat-box.gold { background: #FFFBEB !important; }
    .bid-table tr.winner-row td { background: #EFF6FF !important; }
  }
</style>
</head>
<body>

<!-- SCREEN TOOLBAR (hidden on print) -->
<div class="toolbar">
  <div class="toolbar-left">
    <a href="bidbridge-my-rfqs.html" class="btn-back">← Back to My RFQs</a>
    <a href="bidbridge-buyer-dashboard_2.html" class="toolbar-logo">Bid<span>Bridge</span></a>
  </div>
  <div class="toolbar-actions">
    <button class="btn-print" onclick="window.print()">⬇ Save as PDF / Print</button>
  </div>
</div>

<!-- DOCUMENT -->
<div class="doc-wrap" id="doc-wrap">
  <div class="loading-state" id="loading-state">
    <span class="loading-spinner">⟳</span>
    <div>Building your executive summary…</div>
  </div>
</div>

<script>
  const _supabase = supabase.createClient(
    'https://kgejpzjoiewrgwzixcaa.supabase.co',
    'sb_publishable_LMMf6U9Zg5qX5Buavl1hCA_NEVNRLSy'
  );

  const fmt = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function docHeader(generatedDate, buyerName, buyerCompany) {
    return `
      <div class="doc-header">
        <div class="doc-logo-block">
          <div class="doc-logo">Bid<span>Bridge</span></div>
          <div class="doc-logo-sub">IT Pricing Network</div>
        </div>
        <div class="doc-meta">
          <div class="doc-meta-label">Report generated</div>
          <div class="doc-meta-value">${generatedDate}</div>
          <div class="doc-meta-label" style="margin-top:8px;">Prepared for</div>
          <div class="doc-meta-value">${buyerName} · ${buyerCompany}</div>
        </div>
      </div>`;
  }

  function docFooter(generatedDate, buyerCompany, rfqId) {
    return `
      <div class="doc-footer">
        <div class="doc-footer-left">
          <strong style="color:var(--text);">IT Pricing Network</strong><br>
          Connecting buyers with vetted technology resellers.<br>
          This report is confidential and intended solely for ${buyerCompany}.
        </div>
        <div class="doc-footer-right">
          Generated ${generatedDate}<br>
          RFQ ID: ${rfqId.slice(0, 8).toUpperCase()}
        </div>
      </div>`;
  }

  (async () => {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.href = 'bidbridge-auth_1.html'; return; }

    const rfqId = new URLSearchParams(window.location.search).get('rfq');
    if (!rfqId) { showError('No RFQ specified.'); return; }

    // Load RFQ (include strategy and vendor_awards for split bid support)
    const { data: rfq } = await _supabase.from('rfqs')
      .select('id, title, status, strategy, created_at, deadline, hq_location, winner_reseller_id, winner_price, buyer_id, vendor_awards')
      .eq('id', rfqId).single();

    if (!rfq) { showError('RFQ not found.'); return; }
    if (rfq.buyer_id !== session.user.id) { showError('You do not have access to this RFQ.'); return; }

    // Load buyer profile, all bids, and rfq_items (for full vendor list) in parallel
    const [{ data: buyer }, { data: allBids }, { data: rfqItems }] = await Promise.all([
      _supabase.from('profiles').select('first_name, last_name, company').eq('id', session.user.id).single(),
      _supabase.from('bids').select('id, reseller_id, total_price, status, created_at, line_items').eq('rfq_id', rfqId).order('total_price', { ascending: true }),
      _supabase.from('rfq_items').select('vendor').eq('rfq_id', rfqId),
    ]);

    if (!allBids || allBids.length === 0) { showError('No bids found for this RFQ.'); return; }

    // Load reseller profiles
    const resellerIds = [...new Set(allBids.map(b => b.reseller_id))];
    const { data: resellers } = await _supabase.from('reseller_profiles')
      .select('id, company, contact_first, contact_last').in('id', resellerIds);
    const rpMap = {};
    (resellers || []).forEach(r => rpMap[r.id] = r);

    // Shared helpers
    const buyerName     = buyer ? `${buyer.first_name || ''} ${buyer.last_name || ''}`.trim() : 'Valued Customer';
    const buyerCompany  = buyer?.company || 'your organization';
    const rfqTitle      = rfq.title || 'Technology Procurement';
    const createdAt     = new Date(rfq.created_at);
    const daysOnMarket  = Math.max(1, Math.round((new Date() - createdAt) / (1000 * 60 * 60 * 24)));
    const generatedDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    const createdDate   = createdAt.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    const bidCount      = allBids.length;

    const resellerDisplayName = (rp) => rp ? (rp.company || `${rp.contact_first || ''} ${rp.contact_last || ''}`.trim()) : 'Reseller';

    document.getElementById('loading-state').remove();
    const wrap = document.getElementById('doc-wrap');

    /* ══════════════════════════════════════════════
       SPLIT BID — per-vendor sections
    ══════════════════════════════════════════════ */
    // Show split view if strategy is split AND there are multiple vendors in rfq_items
    const allRfqVendors = [...new Set((rfqItems || []).map(i => i.vendor))].filter(Boolean);
    const isSplit = rfq.strategy === 'split' && allRfqVendors.length > 0;

    if (isSplit) {
      const vendorAwards = rfq.vendor_awards || {};
      // Use all vendors from rfq_items so unawarded vendors still appear
      const awardedVendors = allRfqVendors;

      // Pre-compute per-vendor subtotals for every bid using line_items
      // bidVendorAmt[bidId][vendor] = dollar amount that bid covers for that vendor
      const bidVendorAmt = {};
      for (const bid of allBids) {
        bidVendorAmt[bid.id] = {};
        if (bid.line_items) {
          for (const vendor of awardedVendors) {
            const vendorLines = bid.line_items.filter(li => li.vendor === vendor);
            if (vendorLines.length > 0) {
              bidVendorAmt[bid.id][vendor] = vendorLines.reduce((s, li) => {
                return s + parseFloat(li.line_total || (parseFloat(li.unit_price || 0) * (li.quantity || 1)));
              }, 0);
            }
          }
        }
      }

      // Build a compact BoM summary string for a bid + vendor
      const bomSummary = (bid, vendor) => {
        if (!bid?.line_items) return '';
        const lines = bid.line_items.filter(li => li.vendor === vendor);
        if (lines.length === 0) return '';
        const MAX = 3;
        const names = lines.slice(0, MAX).map(li => {
          const raw = li.description || li.sku || 'Item';
          return raw.length > 35 ? raw.slice(0, 35) + '…' : raw;
        });
        const more = lines.length > MAX ? ` +${lines.length - MAX} more` : '';
        return `${lines.length} item${lines.length !== 1 ? 's' : ''} · ${names.join(', ')}${more}`;
      };

      // Build per-vendor HTML sections
      const vendorSections = awardedVendors.map(vendor => {
        const awardedBidId = vendorAwards[vendor];
        const awardedBid   = allBids.find(b => b.id === awardedBidId);
        const awardedRp    = awardedBid ? rpMap[awardedBid.reseller_id] : null;
        const awardedName  = resellerDisplayName(awardedRp);

        // Only include bids that have a line item for this vendor
        const vendorBids   = allBids.filter(b => bidVendorAmt[b.id]?.[vendor] != null);
        const vendorPrices = vendorBids.map(b => bidVendorAmt[b.id][vendor]).filter(p => p > 0);

        const awardedPrice   = awardedBid ? (bidVendorAmt[awardedBid.id]?.[vendor] ?? Number(awardedBid.total_price ?? 0)) : 0;
        const highestVendor  = vendorPrices.length > 0 ? Math.max(...vendorPrices) : awardedPrice;
        const avgVendor      = vendorPrices.length > 0 ? vendorPrices.reduce((a, b) => a + b, 0) / vendorPrices.length : awardedPrice;
        const savedVsHighest = highestVendor - awardedPrice;
        const pctVsHighest   = highestVendor > 0 ? (savedVsHighest / highestVendor * 100) : 0;

        const awardedBom = awardedBid ? bomSummary(awardedBid, vendor) : '';

        const tableRows = vendorBids
          .slice().sort((a, b) => (bidVendorAmt[a.id][vendor] || 0) - (bidVendorAmt[b.id][vendor] || 0))
          .map((bid, i) => {
            const rp       = rpMap[bid.reseller_id];
            const name     = resellerDisplayName(rp);
            const isWinner = bid.id === awardedBidId;
            const amt      = bidVendorAmt[bid.id]?.[vendor] ?? 0;
            const diff     = avgVendor > 0 ? ((amt - avgVendor) / avgVendor * 100) : 0;
            const diffStr  = (diff >= 0 ? '+' : '') + diff.toFixed(1) + '%';
            const bom      = bomSummary(bid, vendor);
            return `<tr class="${isWinner ? 'winner-row' : ''}">
              <td>${i + 1}</td>
              <td>
                ${name}${isWinner ? '<span class="winner-badge">✓ Awarded</span>' : ''}
                ${bom ? `<div style="font-size:11px;color:var(--text-muted);margin-top:3px;font-weight:400;">${bom}</div>` : ''}
              </td>
              <td>${fmt(amt)}</td>
              <td>${diffStr}</td>
              <td>${isWinner ? 'Awarded' : 'Submitted'}</td>
            </tr>`;
          }).join('');

        const isAwarded = !!awardedBidId;
        const headerBg = isAwarded ? 'var(--accent-bg)' : '#FFFBEB';
        const headerBorder = isAwarded ? '#BFDBFE' : '#FDE68A';
        const statusBadge = isAwarded
          ? `<span style="background:var(--accent-bg);color:var(--accent);border:1px solid #BFDBFE;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;">✓ Awarded</span>`
          : `<span style="background:#FFFBEB;color:var(--gold);border:1px solid #FDE68A;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;">Awaiting award</span>`;

        return `
          <div class="section-label" style="margin-top:32px;">${vendor} ${statusBadge}</div>
          <div style="display:flex;align-items:center;gap:16px;background:${headerBg};border:1px solid ${headerBorder};border-radius:12px;padding:16px 20px;margin-bottom:20px;flex-wrap:wrap;">
            <div style="font-size:22px;flex-shrink:0;">${isAwarded ? '🏆' : '⏳'}</div>
            <div style="flex:1;min-width:160px;">
              <div style="font-size:11px;font-weight:700;color:${isAwarded ? 'var(--accent)' : 'var(--gold)'};text-transform:uppercase;letter-spacing:0.08em;">${isAwarded ? 'Awarded to' : 'Lowest bid received'}</div>
              <div style="font-size:16px;font-weight:600;color:var(--text);margin-top:2px;">${isAwarded ? awardedName : (vendorBids.length > 0 ? resellerDisplayName(rpMap[vendorBids.slice().sort((a,b) => (bidVendorAmt[a.id]?.[vendor]??Infinity)-(bidVendorAmt[b.id]?.[vendor]??Infinity))[0]?.reseller_id]) : '—')}</div>
              ${awardedBom ? `<div style="font-size:12px;color:var(--text-muted);margin-top:5px;">${awardedBom}</div>` : ''}
            </div>
            <div style="font-size:22px;font-weight:800;color:${isAwarded ? 'var(--accent)' : 'var(--gold)'};font-family:'Inter',sans-serif;">${fmt(awardedPrice || (vendorPrices.length ? Math.min(...vendorPrices) : 0))}</div>
            ${vendorPrices.length > 1 ? `
            <div style="text-align:right;border-left:1px solid var(--border);padding-left:16px;margin-left:4px;">
              <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Saved vs. highest</div>
              <div style="font-size:20px;font-weight:700;color:var(--success);">${fmt(savedVsHighest)}</div>
              <div style="font-size:12px;color:var(--text-muted);">${pctVsHighest.toFixed(1)}% below market ceiling</div>
            </div>` : ''}
          </div>
          <table class="bid-table" style="margin-bottom:8px;">
            <thead>
              <tr>
                <th>#</th>
                <th>Reseller</th>
                <th>Bid for ${vendor}</th>
                <th>vs. Avg</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>`;
      }).join('');

      // Overall totals — use awarded price where available, lowest received bid otherwise
      const totalAwardedValue = allRfqVendors.reduce((sum, v) => {
        const awardBid = allBids.find(b => b.id === vendorAwards[v]);
        if (awardBid) return sum + (bidVendorAmt[awardBid.id]?.[v] ?? Number(awardBid.total_price ?? 0));
        const prices = allBids.filter(b => bidVendorAmt[b.id]?.[v] != null).map(b => bidVendorAmt[b.id][v]).filter(p => p > 0);
        return sum + (prices.length > 0 ? Math.min(...prices) : 0);
      }, 0);
      const totalHighestValue = allRfqVendors.reduce((sum, v) => {
        const prices = allBids.filter(b => bidVendorAmt[b.id]?.[v] != null).map(b => bidVendorAmt[b.id][v]).filter(p => p > 0);
        return sum + (prices.length > 0 ? Math.max(...prices) : 0);
      }, 0);
      const totalSavings    = totalHighestValue - totalAwardedValue;
      const totalPctSavings = totalHighestValue > 0 ? (totalSavings / totalHighestValue * 100) : 0;

      wrap.innerHTML = `
        ${docHeader(generatedDate, buyerName, buyerCompany)}

        <div class="doc-title-block">
          <div class="doc-eyebrow">Executive Summary — Split Bid Procurement Report</div>
          <div class="doc-title">${rfqTitle}</div>
          <div class="doc-subtitle">RFQ opened ${createdDate} · ${bidCount} bid${bidCount !== 1 ? 's' : ''} received · ${awardedVendors.length} vendor${awardedVendors.length !== 1 ? 's' : ''} awarded · ${daysOnMarket} days on market</div>
        </div>

        <div class="thank-you-card">
          <p>Dear ${buyerName},</p>
          <p>Thank you for trusting IT Pricing Network to help ${buyerCompany} secure competitive pricing across multiple vendor categories. By using a <strong>split bid strategy</strong>, you were able to independently award each vendor category to the most competitive reseller — maximizing savings at every level of your procurement.</p>
          <p>This report summarizes the competitive market activity for your <strong>"${rfqTitle}"</strong> RFQ, broken down by each awarded vendor category. We hope it serves as a clear and useful record for your internal approval and budgeting process.</p>
        </div>

        <div class="section-label">Overall market activity</div>
        <div class="stat-grid">
          <div class="stat-box">
            <div class="stat-box-label">Days on market</div>
            <div class="stat-box-value">${daysOnMarket}</div>
            <div class="stat-box-sub">From open to close</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-label">Bids received</div>
            <div class="stat-box-value">${bidCount}</div>
            <div class="stat-box-sub">Competing resellers</div>
          </div>
          <div class="stat-box accent">
            <div class="stat-box-label">Total awarded value</div>
            <div class="stat-box-value">${fmt(totalAwardedValue)}</div>
            <div class="stat-box-sub">Across ${awardedVendors.length} vendor${awardedVendors.length !== 1 ? 's' : ''}</div>
          </div>
        </div>

        ${vendorSections}

        ${totalSavings > 0 ? `
        <div class="section-label" style="margin-top:40px;">Overall savings</div>
        <div class="savings-grid">
          <div class="savings-box">
            <div class="savings-box-value">${fmt(totalSavings)}</div>
            <div class="savings-box-label">Total saved vs. highest bids across all vendor categories</div>
          </div>
          <div class="savings-box">
            <div class="savings-box-value">${totalPctSavings.toFixed(1)}%</div>
            <div class="savings-box-label">Below the market ceiling across all vendor categories</div>
          </div>
          <div class="savings-box">
            <div class="savings-box-value">${awardedVendors.length}</div>
            <div class="savings-box-label">Vendor categories independently awarded via competitive split bid</div>
          </div>
        </div>` : ''}

        ${docFooter(generatedDate, buyerCompany, rfqId)}
      `;
      return;
    }

    /* ══════════════════════════════════════════════
       SOLE SOURCE — original single-winner layout
    ══════════════════════════════════════════════ */
    const prices      = allBids.map(b => Number(b.total_price || 0)).filter(p => p > 0);
    const highestBid  = Math.max(...prices);
    const lowestBid   = Math.min(...prices);
    const averageBid  = prices.reduce((a, b) => a + b, 0) / prices.length;

    // Fix 1: resolve awarded price from the actual awarded bid, not winner_price fallback to lowestBid.
    // winner_price is the canonical source; fall back to looking up the bid via vendor_awards or
    // winner_reseller_id so a null winner_price never silently reports the lowest bid's savings.
    const awardedBidRecord = (() => {
      const awardedId = Object.values(rfq.vendor_awards || {})[0];
      if (awardedId) return allBids.find(b => b.id === awardedId) || null;
      if (rfq.winner_reseller_id) return allBids.find(b => b.reseller_id === rfq.winner_reseller_id) || null;
      return null;
    })();
    const awardedBid = rfq.winner_price
      ? Number(rfq.winner_price)
      : awardedBidRecord
        ? Number(awardedBidRecord.total_price)
        : null;

    const hasSavings     = awardedBid !== null && awardedBid < highestBid;
    const savedVsHighest = awardedBid !== null ? highestBid - awardedBid : 0;
    const pctVsHighest   = highestBid > 0 ? (savedVsHighest / highestBid) * 100 : 0;
    // Fix 3: don't clamp negative pctVsAverage — track it honestly for conditional rendering
    const pctVsAverage   = averageBid > 0 && awardedBid !== null ? ((averageBid - awardedBid) / averageBid) * 100 : 0;

    const winnerRp   = rfq.winner_reseller_id ? rpMap[rfq.winner_reseller_id] : null;
    const winnerName = resellerDisplayName(winnerRp);

    wrap.innerHTML = `
      ${docHeader(generatedDate, buyerName, buyerCompany)}

      <div class="doc-title-block">
        <div class="doc-eyebrow">Executive Summary — Procurement Report</div>
        <div class="doc-title">${rfqTitle}</div>
        <div class="doc-subtitle">RFQ opened ${createdDate} · ${bidCount} bid${bidCount !== 1 ? 's' : ''} received · ${daysOnMarket} days on market</div>
      </div>

      <div class="thank-you-card">
        <p>Dear ${buyerName},</p>
        ${hasSavings
          ? `<p>Thank you for trusting IT Pricing Network to help ${buyerCompany} secure competitive pricing on your technology investment. By opening your requirements to our vetted reseller network and letting the market compete for your business, you unlocked real price discovery that a traditional single-vendor quote simply cannot provide.</p>`
          : `<p>Thank you for using IT Pricing Network for your procurement of <strong>"${rfqTitle}"</strong>. Your RFQ attracted ${bidCount} competing bid${bidCount !== 1 ? 's' : ''}, giving you full market visibility. The awarded reseller was selected at the market ceiling — competitive pricing data is documented below for your records.</p>`
        }
        <p>This report summarizes the market activity for your <strong>"${rfqTitle}"</strong> RFQ and documents the financial outcome of your procurement. We hope it serves as a useful record for your internal approval and budgeting process.</p>
      </div>

      <div class="section-label">Market activity</div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-box-label">Days on market</div>
          <div class="stat-box-value">${daysOnMarket}</div>
          <div class="stat-box-sub">From open to close</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-label">Bids received</div>
          <div class="stat-box-value">${bidCount}</div>
          <div class="stat-box-sub">Competing resellers</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-label">Highest bid</div>
          <div class="stat-box-value">${fmt(highestBid)}</div>
          <div class="stat-box-sub">Market ceiling</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-label">Average bid</div>
          <div class="stat-box-value">${fmt(averageBid)}</div>
          <div class="stat-box-sub">Market average</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-label">Lowest bid</div>
          <div class="stat-box-value">${fmt(lowestBid)}</div>
          <div class="stat-box-sub">Market floor</div>
        </div>
        <div class="stat-box accent">
          <div class="stat-box-label">Awarded price</div>
          <div class="stat-box-value">${fmt(awardedBid)}</div>
          <div class="stat-box-sub">Awarded to ${winnerName}</div>
        </div>
      </div>

      <div class="section-label">Bid breakdown</div>
      <table class="bid-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Reseller</th>
            <th>Bid amount</th>
            <th>vs. Market avg</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${allBids.sort((a, b) => a.total_price - b.total_price).map((bid, i) => {
            const rp = rpMap[bid.reseller_id];
            const name = resellerDisplayName(rp);
            const awardedBidIds = Object.values(rfq.vendor_awards || {});
            const isWinner = awardedBidIds.includes(bid.id) || bid.reseller_id === rfq.winner_reseller_id || bid.status === 'accepted';
            const diff = ((bid.total_price - averageBid) / averageBid * 100);
            const diffStr = (diff >= 0 ? '+' : '') + diff.toFixed(1) + '%';
            // Summarize vendors + item count from line_items
            const lines = bid.line_items || [];
            const vendors = [...new Set(lines.map(li => li.vendor).filter(Boolean))];
            const MAX = 3;
            const itemNames = lines.slice(0, MAX).map(li => {
              const raw = li.description || li.sku || 'Item';
              return raw.length > 35 ? raw.slice(0, 35) + '…' : raw;
            });
            const moreItems = lines.length > MAX ? ` +${lines.length - MAX} more` : '';
            const bomLine = lines.length > 0
              ? `${vendors.length > 0 ? vendors.join(', ') + ' · ' : ''}${lines.length} item${lines.length !== 1 ? 's' : ''}: ${itemNames.join(', ')}${moreItems}`
              : '';
            return `<tr class="${isWinner ? 'winner-row' : ''}">
              <td>${i + 1}</td>
              <td>
                ${name}${isWinner ? '<span class="winner-badge">✓ Awarded</span>' : ''}
                ${bomLine ? `<div style="font-size:11px;color:var(--text-muted);margin-top:3px;font-weight:400;">${bomLine}</div>` : ''}
              </td>
              <td>${fmt(bid.total_price)}</td>
              <td>${diffStr}</td>
              <td>${isWinner ? 'Awarded' : bid.status === 'rejected' ? 'Not selected' : 'Submitted'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>

      ${hasSavings ? `
      <div class="section-label">Your savings</div>
      <div class="savings-grid">
        <div class="savings-box">
          <div class="savings-box-value">${fmt(savedVsHighest)}</div>
          <div class="savings-box-label">Saved vs. highest bid received</div>
        </div>
        <div class="savings-box">
          <div class="savings-box-value">${pctVsHighest.toFixed(1)}%</div>
          <div class="savings-box-label">Below the highest price quoted in the market</div>
        </div>
        <div class="savings-box">
          <div class="savings-box-value">${pctVsAverage > 0 ? pctVsAverage.toFixed(1) + '%' : '—'}</div>
          <div class="savings-box-label">${pctVsAverage > 0 ? 'Below the average bid price across all resellers' : 'Awarded above market average'}</div>
        </div>
      </div>` : `
      <div class="section-label">Pricing outcome</div>
      <div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:22px 26px;display:flex;align-items:flex-start;gap:16px;">
        <div style="font-size:24px;flex-shrink:0;">📋</div>
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;">Awarded at market ceiling</div>
          <div style="font-size:13px;color:var(--text-muted);line-height:1.7;">The selected bid was the highest-priced quote received. While no cost savings vs. the market ceiling were achieved, this report documents the full competitive landscape — ${bidCount} reseller${bidCount !== 1 ? 's' : ''} submitted quotes, giving you verified market pricing for your records and future negotiations.</div>
        </div>
      </div>`}


      ${docFooter(generatedDate, buyerCompany, rfqId)}
    `;
  })();

  function showError(msg) {
    document.getElementById('doc-wrap').innerHTML = `
      <div class="loading-state">
        <div style="font-size:32px;margin-bottom:16px;">⚠</div>
        <div style="color:var(--error);">${msg}</div>
        <a href="bidbridge-my-rfqs.html" style="color:var(--accent);margin-top:16px;display:inline-block;">← Back to My RFQs</a>
      </div>`;
  }
</script>
</body>
</html>
